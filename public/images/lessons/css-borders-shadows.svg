<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcb8" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcb8)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Рамки, Тени и Glassmorphism</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">box-shadow vs drop-shadow(), border-radius, outline-offset, focus-visible и стекло</text>

  <!-- Left: Shadows -->
  <rect x="20" y="65" width="370" height="175" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">box-shadow vs filter: drop-shadow()</text>
  
  <rect x="35" y="96" width="340" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="112" fill="#29e7ff" font-size="9" font-weight="600">box-shadow: x y blur spread color [inset];</text>
  <text x="45" y="126" fill="#e6edf3" font-size="8">Прямоугольная тень коробки контейнера.</text>
  <text x="45" y="140" fill="#2dff8a" font-size="8">Многослойная: 0 4px 6px rgba(0,0,0,0.1), 0 10px 24px rgba(0,0,0,0.2)</text>

  <rect x="35" y="162" width="340" height="66" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="45" y="178" fill="#ffb02e" font-size="9" font-weight="600">filter: drop-shadow(x y blur color);</text>
  <text x="45" y="192" fill="#e6edf3" font-size="8">Тень ТОЧНО повторяет контур прозрачного PNG,</text>
  <text x="45" y="204" fill="#e6edf3" font-size="8">SVG-иконки или стрелочки тултипа ::after!</text>
  <text x="45" y="218" fill="#8b949e" font-size="7">Незаменим для сложных непрямоугольных фигур</text>

  <!-- Right: Glassmorphism &amp; Focus -->
  <rect x="410" y="65" width="370" height="175" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Glassmorphism &amp; Доступный фокус</text>
  
  <rect x="425" y="96" width="340" height="60" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="112" fill="#2dff8a" font-size="9" font-weight="600">Эффект матового стекла (Glassmorphism):</text>
  <text x="435" y="126" fill="#e6edf3" font-size="8">background: rgba(22, 27, 34, 0.7);</text>
  <text x="435" y="138" fill="#29e7ff" font-size="8">backdrop-filter: blur(12px) saturate(180%);</text>
  <text x="435" y="150" fill="#8b949e" font-size="7">border: 1px solid rgba(255, 255, 255, 0.1);</text>

  <rect x="425" y="162" width="340" height="66" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="435" y="178" fill="#ffb02e" font-size="9" font-weight="600">:focus-visible и outline-offset</text>
  <text x="435" y="192" fill="#e6edf3" font-size="8">button:focus-visible {</text>
  <text x="450" y="206" fill="#2dff8a" font-size="8">outline: 2px solid #2dff8a; outline-offset: 4px;</text>
  <text x="435" y="220" fill="#e6edf3" font-size="8">} // Фокус виден ТОЛЬКО при навигации Tab!</text>

  <!-- Border Radius Shapes -->
  <rect x="20" y="250" width="760" height="95" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="270" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">Геометрия border-radius</text>
  
  <rect x="35" y="280" width="230" height="52" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="296" fill="#29e7ff" font-size="9" text-anchor="middle">border-radius: 50%</text>
  <text x="150" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Идеальный круг (для аватарок)</text>
  <text x="150" y="322" fill="#8b949e" font-size="7" text-anchor="middle">при равных width и height</text>

  <rect x="275" y="280" width="230" height="52" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="296" fill="#2dff8a" font-size="9" text-anchor="middle">border-radius: 9999px</text>
  <text x="390" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Таблетка (Pill button)</text>
  <text x="390" y="322" fill="#8b949e" font-size="7" text-anchor="middle">Круглые боковые стороны</text>

  <rect x="515" y="280" width="250" height="52" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="640" y="296" fill="#ffb02e" font-size="9" text-anchor="middle">50px 20px / 20px 50px</text>
  <text x="640" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Эллиптические скругления (слеш /)</text>
  <text x="640" y="322" fill="#8b949e" font-size="7" text-anchor="middle">Органические капли и блобы</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="355" width="760" height="70" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-dasharray="4,3"/>
  <text x="400" y="375" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">💡 Неоновое свечение в стиле Киберпанк</text>
  <text x="400" y="392" fill="#e6edf3" font-size="8" text-anchor="middle">box-shadow: 0 0 25px oklch(0.85 0.22 142 / 0.5); — тень без смещения (x=0, y=0) создает эффект светящегося ореола</text>
  <text x="400" y="408" fill="#8b949e" font-size="7" text-anchor="middle">Никогда не отключайте outline: none без замены на кастомный :focus-visible!</text>
</svg>