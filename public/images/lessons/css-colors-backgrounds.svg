<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgc7" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgc7)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Цветовые пространства и Градиенты</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">RGB vs HSL vs OKLCH, градиентный текст, конические градиенты и color-scheme</text>

  <!-- Color Models Grid -->
  <rect x="20" y="65" width="245" height="175" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="142" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">HEX &amp; RGB (Color 4)</text>
  <rect x="35" y="98" width="215" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="142" y="114" fill="#e6edf3" font-size="9" text-anchor="middle">#2dff8a / #0a0e13ee</text>
  <text x="142" y="128" fill="#8b949e" font-size="7" text-anchor="middle">Шестнадцатеричный + 8-знак альфа</text>
  <rect x="35" y="146" width="215" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="142" y="162" fill="#2dff8a" font-size="9" text-anchor="middle">rgb(45 255 138 / 0.8)</text>
  <text x="142" y="176" fill="#8b949e" font-size="7" text-anchor="middle">Современный синтаксис без запятых</text>
  <text x="142" y="186" fill="#8b949e" font-size="7" text-anchor="middle">Слеш / разделяет альфа-канал</text>
  <text x="142" y="215" fill="#8b949e" font-size="8" text-anchor="middle">Стандартная палитра sRGB</text>

  <rect x="278" y="65" width="245" height="175" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="400" y="85" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">HSL (Интуитивный)</text>
  <rect x="293" y="98" width="215" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="114" fill="#ffb02e" font-size="9" text-anchor="middle">hsl(146 100% 59% / 0.9)</text>
  <text x="400" y="128" fill="#8b949e" font-size="7" text-anchor="middle">Hue (0-360) Saturation Lightness</text>
  <rect x="293" y="146" width="215" height="80" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="400" y="162" fill="#e6edf3" font-size="8" font-weight="600" text-anchor="middle">Идеален для палитр:</text>
  <text x="400" y="176" fill="#8b949e" font-size="7" text-anchor="middle">Базовый: hsl(var(--h) 80% 50%)</text>
  <text x="400" y="190" fill="#2dff8a" font-size="7" text-anchor="middle">Hover: hsl(var(--h) 80% 60%) (+L)</text>
  <text x="400" y="204" fill="#8b949e" font-size="7" text-anchor="middle">Active: hsl(var(--h) 80% 40%) (-L)</text>
  <text x="400" y="218" fill="#8b949e" font-size="7" text-anchor="middle">1 переменная меняет весь бренд!</text>

  <rect x="536" y="65" width="245" height="175" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="658" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">OKLCH (Революция!)</text>
  <rect x="551" y="98" width="215" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="658" y="114" fill="#2dff8a" font-size="9" text-anchor="middle">oklch(0.85 0.22 142)</text>
  <text x="658" y="128" fill="#8b949e" font-size="7" text-anchor="middle">L (светлота) C (хрома) H (оттенок)</text>
  <rect x="551" y="146" width="215" height="80" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="658" y="162" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">Преимущества OKLCH:</text>
  <text x="658" y="176" fill="#e6edf3" font-size="7" text-anchor="middle">✓ Перцептивная равномерность</text>
  <text x="658" y="190" fill="#e6edf3" font-size="7" text-anchor="middle">✓ Одинаковая яркость цветов</text>
  <text x="658" y="204" fill="#29e7ff" font-size="7" text-anchor="middle">✓ P3 Wide Gamut (OLED/Retina)</text>
  <text x="658" y="218" fill="#8b949e" font-size="7" text-anchor="middle">Будущее CSS дизайн-систем</text>

  <!-- Gradients &amp; Backgrounds -->
  <rect x="20" y="250" width="760" height="95" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="270" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">Продвинутые градиенты и градиентный текст</text>
  
  <rect x="35" y="280" width="230" height="52" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="296" fill="#29e7ff" font-size="8" text-anchor="middle">linear-gradient(135deg, #2dff8a, #29e7ff)</text>
  <text x="150" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Направление: to right, 45deg, 135deg</text>
  <text x="150" y="322" fill="#8b949e" font-size="7" text-anchor="middle">Точки остановки: #2dff8a 20%, #29e7ff 80%</text>

  <rect x="275" y="280" width="230" height="52" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="296" fill="#ffb02e" font-size="8" text-anchor="middle">radial-gradient(circle, #29e7ff, transparent)</text>
  <text x="390" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Неоновые пятна, свечение вокруг кнопок</text>
  <text x="390" y="322" fill="#8b949e" font-size="7" text-anchor="middle">conic-gradient (спиннеры, рамки)</text>

  <rect x="515" y="280" width="250" height="52" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="640" y="296" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">Градиентный текст в CSS:</text>
  <text x="640" y="310" fill="#e6edf3" font-size="7" text-anchor="middle">background: linear-gradient(90deg, #2dff8a, #29e7ff);</text>
  <text x="640" y="322" fill="#29e7ff" font-size="7" text-anchor="middle">-webkit-background-clip: text; color: transparent;</text>

  <!-- Bottom: color-scheme -->
  <rect x="20" y="355" width="760" height="70" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-dasharray="4,3"/>
  <text x="400" y="375" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">💡 color-scheme: dark — системная тёмная тема</text>
  <text x="400" y="392" fill="#e6edf3" font-size="8" text-anchor="middle">Добавление :root { color-scheme: dark; } автоматически окрашивает скроллбары, чекбоксы и селекты в темный цвет!</text>
  <text x="400" y="408" fill="#8b949e" font-size="7" text-anchor="middle">Медиа-запрос @media (prefers-color-scheme: dark) определяет тему операционной системы пользователя</text>
</svg>