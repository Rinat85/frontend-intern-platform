<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcp14" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcp14)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Переменные (Custom Properties) и Темы</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">:root, var(), каскад в DOM, переключение тем Dark/Light и управление через JS</text>

  <!-- Left: Theme Switching System -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Архитектура Дизайн-Токенов (Темы)</text>

  <!-- Light Theme Box -->
  <rect x="35" y="100" width="160" height="135" rx="6" fill="#ffffff11" stroke="#e6edf3"/>
  <text x="115" y="120" fill="#e6edf3" font-size="8" font-weight="600" text-anchor="middle">☀️ [data-theme="light"]</text>
  <text x="45" y="140" fill="#8b949e" font-size="7">--bg: #ffffff;</text>
  <text x="45" y="156" fill="#8b949e" font-size="7">--text: #0f172a;</text>
  <text x="45" y="172" fill="#8b949e" font-size="7">--accent: #2563eb;</text>
  <text x="45" y="188" fill="#8b949e" font-size="7">--card-bg: #f8fafc;</text>
  <text x="45" y="214" fill="#2dff8a" font-size="6">Светлая тема по умолчанию</text>

  <!-- Dark Theme Box -->
  <rect x="210" y="100" width="165" height="135" rx="6" fill="#161b22" stroke="#2dff8a"/>
  <text x="292" y="120" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">🌙 [data-theme="dark"]</text>
  <text x="220" y="140" fill="#29e7ff" font-size="7">--bg: #0a0e13;</text>
  <text x="220" y="156" fill="#29e7ff" font-size="7">--text: #e6edf3;</text>
  <text x="220" y="172" fill="#29e7ff" font-size="7">--accent: #2dff8a;</text>
  <text x="220" y="188" fill="#29e7ff" font-size="7">--card-bg: #161b22;</text>
  <text x="220" y="214" fill="#2dff8a" font-size="6">Тёмная тема (OLED)</text>

  <text x="205" y="256" fill="#e6edf3" font-size="8" text-anchor="middle">Компоненты используют ТОЛЬКО var(--bg), var(--text)</text>
  <text x="205" y="272" fill="#2dff8a" font-size="7" text-anchor="middle">Переключение 1 атрибута в &lt;html&gt; перекрашивает весь сайт!</text>
  <text x="205" y="290" fill="#8b949e" font-size="6" text-anchor="middle">@media (prefers-color-scheme: dark) — системная тема</text>

  <!-- Right: Runtime & JS Interaction -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Каскад и Управление через JS</text>

  <rect x="425" y="98" width="340" height="55" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">1. Локальный оверрайд (Каскад):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">.card-danger { --accent: #f85149; }</text>
  <text x="435" y="144" fill="#8b949e" font-size="6">Кнопки внутри этой карточки станут красными автоматически!</text>

  <rect x="425" y="160" width="340" height="60" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="178" fill="#29e7ff" font-size="8" font-weight="600">2. Динамика в JS в реальном времени:</text>
  <text x="435" y="194" fill="#e6edf3" font-size="7">el.style.setProperty('--mouse-x', `${e.clientX}px`);</text>
  <text x="435" y="208" fill="#8b949e" font-size="6">Идеально для эффектов свечения, параллакса и прогресс-баров</text>

  <rect x="425" y="228" width="340" height="55" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="246" fill="#ffb02e" font-size="8" font-weight="600">3. Fallback значения:</text>
  <text x="435" y="262" fill="#e6edf3" font-size="7">color: var(--custom-color, #2dff8a);</text>
  <text x="435" y="274" fill="#8b949e" font-size="6">Второй аргумент сработает, если переменная не объявлена</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Главное преимущество CSS Custom Properties</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• В отличие от SCSS-переменных, CSS-переменные живут в DOM-дереве браузера в рантайме</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Наследуются по каскаду: переопределение на родительском блоке меняет цвет всех вложенных потомков</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Позволяют создавать полноценные дизайн-системы с мгновенным переключением Dark/Light тем</text>
</svg>