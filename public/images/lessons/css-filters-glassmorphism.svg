<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgflt21" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgflt21)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Фильтры, Glassmorphism, Blend-mode и clip-path</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">filter, backdrop-filter, drop-shadow vs box-shadow, mix-blend-mode, clip-path и mask</text>

  <!-- Left: filter & Glassmorphism -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">CSS Фильтры и Glassmorphism</text>

  <rect x="35" y="100" width="340" height="65" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="45" y="118" fill="#2dff8a" font-size="8" font-weight="600">Функции filter (Эффекты над элементом):</text>
  <text x="45" y="132" fill="#e6edf3" font-size="7">filter: blur(8px) brightness(1.2) contrast(110%);</text>
  <text x="45" y="146" fill="#8b949e" font-size="6">drop-shadow(0 4px 12px #2dff8a) — тень по прозрачному контуру SVG/PNG!</text>
  <text x="45" y="156" fill="#8b949e" font-size="6">grayscale(100%), hue-rotate(180deg), invert(1)</text>

  <rect x="35" y="172" width="340" height="75" rx="4" fill="#29e7ff11" stroke="#29e7ff"/>
  <text x="45" y="190" fill="#29e7ff" font-size="8" font-weight="600">backdrop-filter (Матовое стекло Glassmorphism):</text>
  <text x="45" y="206" fill="#e6edf3" font-size="7">.glass-card {</text>
  <text x="45" y="218" fill="#e6edf3" font-size="7">  background: rgba(22, 27, 34, 0.6);</text>
  <text x="45" y="230" fill="#e6edf3" font-size="7">  backdrop-filter: blur(16px) saturate(180%);</text>
  <text x="45" y="240" fill="#8b949e" font-size="6">  border: 1px solid rgba(255, 255, 255, 0.1);</text>

  <rect x="35" y="254" width="340" height="58" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="45" y="272" fill="#ffb02e" font-size="8" font-weight="600">@supports для надежных фолбеков:</text>
  <text x="45" y="286" fill="#e6edf3" font-size="7">@supports not (backdrop-filter: blur(10px)) {</text>
  <text x="45" y="298" fill="#8b949e" font-size="6">  .glass-card { background: #161b22; } /* Непрозрачный фолбек */</text>

  <!-- Right: mix-blend-mode & clip-path -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Режимы наложения и clip-path</text>

  <rect x="425" y="98" width="340" height="70" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="116" fill="#ffb02e" font-size="8" font-weight="600">mix-blend-mode (Режимы наложения Photoshop):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">• multiply: удаляет белый фон логотипа</text>
  <text x="435" y="144" fill="#e6edf3" font-size="7">• screen: удаляет черный фон светового блика</text>
  <text x="435" y="156" fill="#e6edf3" font-size="7">• difference: инвертирует цвет текста над контрастным фоном</text>

  <rect x="425" y="174" width="340" height="75" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="192" fill="#2dff8a" font-size="8" font-weight="600">clip-path (Геометрическая обрезка):</text>
  <text x="435" y="208" fill="#e6edf3" font-size="7">clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);</text>
  <text x="435" y="222" fill="#8b949e" font-size="6">Скошенные углы, треугольники, звезды без SVG файлов!</text>
  <text x="435" y="234" fill="#29e7ff" font-size="6">Плавно анимируется в @keyframes на GPU</text>

  <rect x="425" y="255" width="340" height="55" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="435" y="272" fill="#ff2bd6" font-size="8" font-weight="600">mask-image (Растворение краев градиентом):</text>
  <text x="435" y="286" fill="#e6edf3" font-size="7">mask-image: linear-gradient(to bottom, black 80%, transparent 100%);</text>
  <text x="435" y="296" fill="#8b949e" font-size="6">Идеально для исчезающих списков со скроллом</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Инженерные секреты визуальных эффектов</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• backdrop-filter требует полупрозрачного фона (rgba / #rrggbbaa), иначе эффекта размытия не будет видно</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Для PNG и SVG иконок всегда используйте filter: drop-shadow() вместо box-shadow</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• clip-path: polygon() с одинаковым количеством вершин анимируется через transition с 60 FPS</text>
</svg>