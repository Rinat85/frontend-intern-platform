<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgci10" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgci10)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS Flexbox: Свойства Элементов (Flex Items)</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">flex-grow, flex-shrink, flex-basis, сокращение flex: 1, align-self и order</text>

  <!-- Left: grow vs shrink vs basis -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Триада flex: grow shrink basis</text>

  <!-- flex-grow demo -->
  <rect x="35" y="98" width="430" height="68" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="114" fill="#2dff8a" font-size="8" font-weight="600">flex-grow: N; (Расширение в свободное пространство)</text>
  <rect x="45" y="124" width="100" height="30" rx="3" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="95" y="142" fill="#2dff8a" font-size="7" text-anchor="middle">grow: 1 (1 часть)</text>
  <rect x="155" y="124" width="200" height="30" rx="3" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="255" y="142" fill="#29e7ff" font-size="7" text-anchor="middle">grow: 2 (2 части свободного места!)</text>
  <rect x="365" y="124" width="90" height="30" rx="3" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="410" y="142" fill="#ffb02e" font-size="7" text-anchor="middle">grow: 0 (не растёт)</text>

  <!-- flex-shrink demo -->
  <rect x="35" y="172" width="430" height="68" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="188" fill="#ffb02e" font-size="8" font-weight="600">flex-shrink: N; (Сжатие при дефиците места)</text>
  <rect x="45" y="198" width="170" height="30" rx="3" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="130" y="216" fill="#ffb02e" font-size="7" text-anchor="middle">shrink: 1 (сжимается штатно)</text>
  <rect x="225" y="198" width="230" height="30" rx="3" fill="#f8514922" stroke="#f85149"/>
  <text x="340" y="216" fill="#f85149" font-size="7" text-anchor="middle">shrink: 0 (ЗАПРЕТ сжатия для иконок!)</text>

  <!-- flex-basis -->
  <rect x="35" y="246" width="430" height="68" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="262" fill="#ff2bd6" font-size="8" font-weight="600">flex-basis: 200px | auto | 0;</text>
  <text x="45" y="280" fill="#e6edf3" font-size="7">Базовый размер элемента ДО распределения свободного пространства.</text>
  <text x="45" y="296" fill="#8b949e" font-size="7">Приоритет: min/max-width &gt; flex-basis &gt; width.</text>

  <!-- Right: Shorthand & align-self -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Сокращение flex</text>

  <rect x="515" y="98" width="250" height="42" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="525" y="114" fill="#2dff8a" font-size="8" font-weight="600">flex: 1; (1 1 0%)</text>
  <text x="525" y="128" fill="#8b949e" font-size="7">Равные колонки независимо от контента</text>

  <rect x="515" y="146" width="250" height="42" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="525" y="162" fill="#29e7ff" font-size="8" font-weight="600">flex: auto; (1 1 auto)</text>
  <text x="525" y="176" fill="#8b949e" font-size="7">Размер с учетом содержимого</text>

  <rect x="515" y="194" width="250" height="42" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="525" y="210" fill="#ffb02e" font-size="8" font-weight="600">flex: none; (0 0 auto)</text>
  <text x="525" y="224" fill="#8b949e" font-size="7">Жесткий фиксированный размер</text>

  <rect x="515" y="242" width="250" height="70" rx="4" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="525" y="258" fill="#d2a8ff" font-size="8" font-weight="600">align-self &amp; order</text>
  <text x="525" y="272" fill="#e6edf3" font-size="7">align-self: flex-end; (переопределяет)</text>
  <text x="525" y="286" fill="#8b949e" font-size="6">order: 1; (меняет визуальный порядок)</text>

  <!-- Bottom: Tips -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Главное правило: flex-shrink: 0 для иконок и аватарок</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">Когда текст в карточке слишком длинный, flex-shrink: 1 по умолчанию сплющивает соседнюю круглую аватарку в овал!</text>
  <text x="400" y="390" fill="#2dff8a" font-size="8" text-anchor="middle">✅ Решение: ВСЕГДА ставьте .avatar { flex-shrink: 0; } для сохранения идеальных пропорций</text>
  <text x="400" y="405" fill="#8b949e" font-size="7" text-anchor="middle">Используйте flex: 1 1 0% вместо flex-grow: 1 для создания идеально равных адаптивных колонок</text>
</svg>