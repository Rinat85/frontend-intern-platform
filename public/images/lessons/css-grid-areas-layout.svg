<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcg12" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcg12)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS Grid: Области (grid-template-areas) и Наложение</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">grid-template-areas, grid-area, span, grid lines (1 / -1), наложение слоев и z-index</text>

  <!-- Left: grid-template-areas Visual Layout -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Макет страницы через grid-template-areas</text>

  <!-- Header Area -->
  <rect x="35" y="98" width="430" height="34" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="250" y="120" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">"header   header"</text>

  <!-- Sidebar + Main -->
  <rect x="35" y="138" width="130" height="120" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="100" y="195" fill="#ffb02e" font-size="8" font-weight="600" text-anchor="middle">"sidebar"</text>
  <text x="100" y="210" fill="#8b949e" font-size="6" text-anchor="middle">grid-area: sidebar;</text>

  <rect x="175" y="138" width="290" height="120" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="320" y="195" fill="#29e7ff" font-size="9" font-weight="600" text-anchor="middle">"main"</text>
  <text x="320" y="210" fill="#8b949e" font-size="7" text-anchor="middle">grid-area: main; (Основной контент)</text>

  <!-- Footer Area -->
  <rect x="35" y="264" width="430" height="30" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="250" y="284" fill="#d2a8ff" font-size="8" font-weight="600" text-anchor="middle">"footer   footer"</text>

  <text x="250" y="312" fill="#8b949e" font-size="7" text-anchor="middle">. = пустая ячейка (пропуск)  |  Точное соответствие колонкам и строкам</text>

  <!-- Right: Overlap & Grid Lines -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Наложение и Линии</text>

  <rect x="515" y="98" width="250" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="116" fill="#29e7ff" font-size="8" font-weight="600">grid-column: 1 / -1;</text>
  <text x="525" y="132" fill="#e6edf3" font-size="7">Растяжение на ВСЮ ширину сетки</text>
  <text x="525" y="146" fill="#8b949e" font-size="6">от первой (1) до последней (-1) линии!</text>

  <rect x="515" y="166" width="250" height="85" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="525" y="184" fill="#ff2bd6" font-size="8" font-weight="600">Наложение (Overlap) БЕЗ absolute:</text>
  <text x="525" y="200" fill="#e6edf3" font-size="7">.bg-image { grid-area: 1 / 1; }</text>
  <text x="525" y="214" fill="#2dff8a" font-size="7">.text-box { grid-area: 1 / 1; z-index: 2; }</text>
  <text x="525" y="230" fill="#8b949e" font-size="6">Оба элемента делят одну ячейку 1 / 1!</text>

  <rect x="515" y="260" width="250" height="55" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="278" fill="#ffb02e" font-size="8" font-weight="600">grid-column: span 2;</text>
  <text x="525" y="294" fill="#8b949e" font-size="7">Объединяет 2 соседние колонки</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Визуальная декларация макета через ASCII-арт</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• grid-template-areas позволяет читать структуру страницы прямо в CSS коде</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Для изменения порядка на мобилках достаточно поменять одну строку в @media блоке!</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Grid Overlap заменяет position: absolute для баннеров с текстом поверх картинки</text>
</svg>