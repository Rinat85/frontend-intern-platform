<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcg11" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcg11)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS Grid: Основы и Двумерные Сетки</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">display: grid, фракции fr, repeat(), minmax(), auto-fit/auto-fill и gap</text>

  <!-- Left: Grid 2D Blueprint -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Двумерная координатная сетка (Rows + Columns)</text>

  <!-- Grid visual cells -->
  <rect x="40" y="100" width="130" height="65" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="105" y="136" fill="#2dff8a" font-size="9" text-anchor="middle">Cell 1 (1fr)</text>
  <rect x="180" y="100" width="130" height="65" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="245" y="136" fill="#29e7ff" font-size="9" text-anchor="middle">Cell 2 (1fr)</text>
  <rect x="320" y="100" width="140" height="65" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="390" y="136" fill="#ffb02e" font-size="9" text-anchor="middle">Cell 3 (1fr)</text>

  <rect x="40" y="175" width="130" height="65" rx="4" fill="#ff2bd622" stroke="#ff2bd6"/>
  <text x="105" y="211" fill="#ff2bd6" font-size="9" text-anchor="middle">Cell 4 (1fr)</text>
  <rect x="180" y="175" width="280" height="65" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="320" y="211" fill="#d2a8ff" font-size="9" text-anchor="middle">Cell 5 (grid-column: span 2)</text>

  <!-- Axis labels -->
  <text x="250" y="260" fill="#2dff8a" font-size="8" text-anchor="middle">grid-template-columns: repeat(3, 1fr);  gap: 10px;</text>
  <text x="250" y="278" fill="#8b949e" font-size="7" text-anchor="middle">Управляет строками И столбцами одновременно (в отличие от Flexbox!)</text>

  <!-- Right: auto-fit minmax Magic -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Революция Адаптивности</text>

  <rect x="515" y="98" width="250" height="85" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="525" y="116" fill="#2dff8a" font-size="8" font-weight="600">Сетка БЕЗ медиа-запросов:</text>
  <text x="525" y="132" fill="#e6edf3" font-size="7">grid-template-columns:</text>
  <text x="535" y="146" fill="#29e7ff" font-size="7">repeat(auto-fit,</text>
  <text x="545" y="160" fill="#ffb02e" font-size="7">minmax(280px, 1fr));</text>
  <text x="525" y="174" fill="#8b949e" font-size="6">Авто-перестроение от 1 до 4 колонок!</text>

  <rect x="515" y="192" width="250" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="210" fill="#ff2bd6" font-size="8" font-weight="600">auto-fit vs auto-fill:</text>
  <text x="525" y="226" fill="#e6edf3" font-size="7">auto-fit — растягивает карточки на всю ширину</text>
  <text x="525" y="240" fill="#8b949e" font-size="6">auto-fill — оставляет пустые невидимые слоты</text>

  <rect x="515" y="260" width="250" height="55" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="278" fill="#ffb02e" font-size="8" font-weight="600">minmax(150px, auto):</text>
  <text x="525" y="294" fill="#8b949e" font-size="7">Минимум 150px, максимум по контенту</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Flexbox или Grid? Золотое правило выбора</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Flexbox — одномерный (1D): идеален для компонентов (кнопки с иконкой, строка меню, аватарка + имя, навбар)</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• CSS Grid — двумерный (2D): идеален для макета всей страницы (каркас сайта, каталог карточек, дашборды)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• gap работает в Grid идеально: gap: 20px создает отступы между строками и колонками</text>
</svg>