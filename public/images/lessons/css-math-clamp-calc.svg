<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgmcc19" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgmcc19)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Математические функции clamp(), min(), max(), calc()</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Fluid Typography, адаптивные контейнеры без @media, математика диапазонов</text>

  <!-- Left: calc, min, max -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Функции calc(), min() и max()</text>

  <rect x="35" y="100" width="340" height="58" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="45" y="118" fill="#2dff8a" font-size="8" font-weight="600">calc(выражение) — Смешивание единиц:</text>
  <text x="45" y="132" fill="#e6edf3" font-size="7">height: calc(100vh - 80px); /* экран минус шапка */</text>
  <text x="45" y="146" fill="#8b949e" font-size="6">⚠️ Операторы + и - ОБЯЗАТЕЛЬНО обрамляются пробелами!</text>

  <rect x="35" y="166" width="340" height="65" rx="4" fill="#161b22" stroke="#29e7ff"/>
  <text x="45" y="184" fill="#29e7ff" font-size="8" font-weight="600">min(значение1, значение2) — Верхняя граница:</text>
  <text x="45" y="200" fill="#e6edf3" font-size="7">width: min(100% - 32px, 1200px);</text>
  <text x="45" y="214" fill="#8b949e" font-size="6">Выбирает НАИМЕНЬШЕЕ: на мобилке 100%-32px, на десктопе 1200px</text>

  <rect x="35" y="238" width="340" height="65" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="45" y="256" fill="#ffb02e" font-size="8" font-weight="600">max(значение1, значение2) — Нижняя граница:</text>
  <text x="45" y="272" fill="#e6edf3" font-size="7">padding: max(16px, 4vw);</text>
  <text x="45" y="286" fill="#8b949e" font-size="6">Выбирает НАИБОЛЬШЕЕ: отступ никогда не станет меньше 16px</text>

  <!-- Right: clamp & Fluid Typography -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Магия clamp() и Fluid Typography</text>

  <rect x="425" y="98" width="340" height="75" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">clamp(MIN, PREFERRED, MAX):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">font-size: clamp(1.25rem, 1rem + 2vw, 3rem);</text>
  <text x="435" y="148" fill="#8b949e" font-size="6">• Меньше 320px: размер зафиксирован на 1.25rem (20px)</text>
  <text x="435" y="160" fill="#8b949e" font-size="6">• Планшеты: плавно растет пропорционально ширине окна (2vw)</text>
  <text x="435" y="170" fill="#8b949e" font-size="6">• Больше 1920px: зафиксирован на 3rem (48px)</text>

  <rect x="425" y="180" width="340" height="55" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="196" fill="#29e7ff" font-size="8" font-weight="600">Fluid Spacing (Плавные отступы):</text>
  <text x="435" y="210" fill="#e6edf3" font-size="7">gap: clamp(16px, 3vw, 48px);</text>
  <text x="435" y="224" fill="#8b949e" font-size="6">Идеальная адаптивность без единого @media breakpoint!</text>

  <rect x="425" y="242" width="340" height="65" rx="4" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="435" y="258" fill="#d2a8ff" font-size="8" font-weight="600">Преимущество над @media:</text>
  <text x="435" y="274" fill="#e6edf3" font-size="7">Нет скачкообразных рывков при ресайзе окна</text>
  <text x="435" y="288" fill="#8b949e" font-size="6">Плавное масштабирование каждого пикселя интерфейса</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Инженерные правила математических функций CSS</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Внутри min(), max(), clamp() не нужно писать calc() — математические операции вычисляются автоматически</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Для Fluid Typography всегда используйте базовый rem + vw: clamp(1rem, 0.8rem + 1.5vw, 2.5rem)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• width: min(100% - 32px, 1280px); margin-inline: auto; — современный эталон центрированного контейнера</text>
</svg>