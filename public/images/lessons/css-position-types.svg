<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgp5" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgp5)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS Position: 5 типов позиционирования</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Как элементы размещаются в Normal Flow и вне его</text>
  <rect x="20" y="65" width="148" height="155" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="94" y="85" fill="#8b949e" font-size="11" font-weight="600" text-anchor="middle">static</text>
  <text x="94" y="100" fill="#6e7681" font-size="8" text-anchor="middle">(по умолчанию)</text>
  <rect x="35" y="110" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="94" y="125" fill="#e6edf3" font-size="9" text-anchor="middle">Блок A</text>
  <rect x="35" y="138" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="94" y="153" fill="#e6edf3" font-size="9" text-anchor="middle">Блок B</text>
  <rect x="35" y="166" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="94" y="181" fill="#e6edf3" font-size="9" text-anchor="middle">Блок C</text>
  <text x="94" y="210" fill="#6e7681" font-size="7" text-anchor="middle">Normal Flow</text>
  <rect x="178" y="65" width="148" height="155" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="252" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">relative</text>
  <text x="252" y="100" fill="#6e7681" font-size="8" text-anchor="middle">сдвиг от позиции</text>
  <rect x="193" y="110" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="252" y="125" fill="#e6edf3" font-size="9" text-anchor="middle">Блок A</text>
  <rect x="193" y="138" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-dasharray="4,3"/>
  <rect x="203" y="146" width="118" height="22" rx="4" fill="#29e7ff" fill-opacity="0.15" stroke="#29e7ff"/><text x="262" y="161" fill="#29e7ff" font-size="8" text-anchor="middle">B (top:8 left:10)</text>
  <rect x="193" y="166" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="252" y="181" fill="#e6edf3" font-size="9" text-anchor="middle">Блок C</text>
  <text x="252" y="210" fill="#6e7681" font-size="7" text-anchor="middle">Место сохраняется!</text>
  <rect x="336" y="65" width="148" height="155" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="410" y="85" fill="#ffb02e" font-size="11" font-weight="600" text-anchor="middle">absolute</text>
  <text x="410" y="100" fill="#6e7681" font-size="8" text-anchor="middle">по relative предку</text>
  <rect x="351" y="110" width="118" height="60" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="410" y="128" fill="#6e7681" font-size="8" text-anchor="middle">relative-контейнер</text>
  <rect x="420" y="120" width="40" height="18" rx="3" fill="#ffb02e" fill-opacity="0.2" stroke="#ffb02e"/><text x="440" y="133" fill="#ffb02e" font-size="7" text-anchor="middle">abs</text>
  <rect x="351" y="180" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d"/><text x="410" y="195" fill="#e6edf3" font-size="8" text-anchor="middle">C (сдвинулся!)</text>
  <text x="410" y="210" fill="#6e7681" font-size="7" text-anchor="middle">Из потока удалён</text>
  <rect x="494" y="65" width="148" height="155" rx="8" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <text x="568" y="85" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">fixed</text>
  <text x="568" y="100" fill="#6e7681" font-size="8" text-anchor="middle">относит. viewport</text>
  <rect x="509" y="108" width="118" height="80" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="568" y="128" fill="#6e7681" font-size="7" text-anchor="middle">прокручивается...</text>
  <rect x="555" y="145" width="60" height="16" rx="3" fill="#f85149" fill-opacity="0.2" stroke="#f85149"/><text x="585" y="156" fill="#f85149" font-size="7" text-anchor="middle">header</text>
  <text x="568" y="210" fill="#6e7681" font-size="7" text-anchor="middle">Не скроллится!</text>
  <rect x="652" y="65" width="130" height="155" rx="8" fill="none" stroke="#ff2bd6" stroke-width="1.5"/>
  <text x="717" y="85" fill="#ff2bd6" font-size="11" font-weight="600" text-anchor="middle">sticky</text>
  <text x="717" y="100" fill="#6e7681" font-size="8" text-anchor="middle">relative + fixed</text>
  <rect x="662" y="110" width="110" height="70" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="670" y="118" width="94" height="14" rx="3" fill="#ff2bd6" fill-opacity="0.15" stroke="#ff2bd6"/><text x="717" y="129" fill="#ff2bd6" font-size="7" text-anchor="middle">sticky top:0</text>
  <text x="717" y="156" fill="#6e7681" font-size="7" text-anchor="middle">Приклеивается</text>
  <text x="717" y="210" fill="#6e7681" font-size="7" text-anchor="middle">Гибрид</text>
  <rect x="20" y="235" width="760" height="80" rx="8" fill="none" stroke="#2dff8a" stroke-width="1"/>
  <text x="400" y="258" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Контекст наложения (Stacking Context) и z-index</text>
  <text x="400" y="278" fill="#e6edf3" font-size="9" text-anchor="middle">z-index работает ТОЛЬКО на позиционированных элементах (не static)</text>
  <text x="400" y="296" fill="#ffb02e" font-size="8" text-anchor="middle">Stacking Context создают: position + z-index, opacity &lt; 1, transform, filter, will-change</text>
  <rect x="20" y="330" width="370" height="95" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-dasharray="4,3"/>
  <text x="205" y="350" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">Когда использовать</text>
  <text x="205" y="370" fill="#e6edf3" font-size="8" text-anchor="middle">relative: сдвиги и якорь для absolute</text>
  <text x="205" y="385" fill="#e6edf3" font-size="8" text-anchor="middle">absolute: бейджи, тултипы, иконки</text>
  <text x="205" y="400" fill="#e6edf3" font-size="8" text-anchor="middle">fixed: шапка, модалки, FAB-кнопки</text>
  <text x="205" y="415" fill="#e6edf3" font-size="8" text-anchor="middle">sticky: секционная навигация, заголовки</text>
  <rect x="410" y="330" width="370" height="95" rx="8" fill="#0d1117" stroke="#f85149" stroke-dasharray="4,3"/>
  <text x="595" y="350" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">Частые ошибки</text>
  <text x="595" y="370" fill="#e6edf3" font-size="8" text-anchor="middle">absolute без relative предка = к body</text>
  <text x="595" y="385" fill="#e6edf3" font-size="8" text-anchor="middle">z-index на static элементе = игнорируется</text>
  <text x="595" y="400" fill="#e6edf3" font-size="8" text-anchor="middle">fixed внутри transform = ЛОМАЕТСЯ</text>
  <text x="595" y="415" fill="#e6edf3" font-size="8" text-anchor="middle">sticky без overflow: visible = не работает</text>
</svg>