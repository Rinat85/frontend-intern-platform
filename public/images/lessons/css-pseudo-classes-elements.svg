<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcpe18" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcpe18)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Псевдоклассы и Псевдоэлементы</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">:hover, :focus-visible, :has(), :is(), :where(), :nth-child(), ::before, ::after, ::marker</text>

  <!-- Left: Pseudo-classes -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Псевдоклассы (: одно двоеточие)</text>

  <rect x="35" y="98" width="340" height="42" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="45" y="114" fill="#2dff8a" font-size="8" font-weight="600">Состояния UI: :hover, :active, :focus-visible</text>
  <text x="45" y="130" fill="#8b949e" font-size="6">:focus-visible — фокус клавиатуры без кольца при клике мышью!</text>

  <rect x="35" y="146" width="340" height="42" rx="4" fill="#161b22" stroke="#29e7ff"/>
  <text x="45" y="162" fill="#29e7ff" font-size="8" font-weight="600">Структурные: :nth-child(), :first-of-type, :last-child</text>
  <text x="45" y="178" fill="#8b949e" font-size="6">:nth-child(2n+1) — нечетные строки таблицы (zebra-stripe)</text>

  <rect x="35" y="194" width="340" height="42" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="45" y="210" fill="#ffb02e" font-size="8" font-weight="600">Валидация форм: :valid, :invalid, :required, :placeholder-shown</text>
  <text x="45" y="226" fill="#8b949e" font-size="6">input:invalid { border-color: #f85149; } — красная рамка без JS</text>

  <rect x="35" y="242" width="340" height="70" rx="4" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="45" y="258" fill="#2dff8a" font-size="8" font-weight="600">CSS4 Modern: :has(), :is(), :where(), :not()</text>
  <text x="45" y="274" fill="#e6edf3" font-size="7">:has(.error) — «Родительский селектор»! Первый в истории CSS</text>
  <text x="45" y="290" fill="#e6edf3" font-size="7">:is(h1, h2, h3) — группировка без дубликатов кода</text>
  <text x="45" y="302" fill="#8b949e" font-size="6">:where() — аналог :is(), но со специфичностью 0</text>

  <!-- Right: Pseudo-elements -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Псевдоэлементы (:: двойное двоеточие)</text>

  <rect x="425" y="98" width="340" height="55" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="114" fill="#2dff8a" font-size="8" font-weight="600">::before и ::after (Декоративные вставки):</text>
  <text x="435" y="130" fill="#e6edf3" font-size="7">Генерируют виртуальные дочерние узлы через content: ''</text>
  <text x="435" y="144" fill="#8b949e" font-size="6">Иконки, подчеркивания, бейджики БЕЗ засорения DOM</text>

  <rect x="425" y="160" width="340" height="48" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="176" fill="#29e7ff" font-size="8" font-weight="600">::placeholder, ::selection, ::marker:</text>
  <text x="435" y="192" fill="#e6edf3" font-size="7">input::placeholder { color: #8b949e; font-style: italic; }</text>
  <text x="435" y="200" fill="#8b949e" font-size="6">::selection { background: #2dff8a; color: #0a0e13; }</text>

  <rect x="425" y="214" width="340" height="50" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="230" fill="#ffb02e" font-size="8" font-weight="600">::backdrop (Фон модального/dialog):</text>
  <text x="435" y="246" fill="#e6edf3" font-size="7">dialog::backdrop { background: rgba(0,0,0,0.7); }</text>
  <text x="435" y="256" fill="#8b949e" font-size="6">Нативное затемнение фона за &lt;dialog&gt; без оверлеев JS</text>

  <rect x="425" y="270" width="340" height="45" rx="4" fill="#f8514922" stroke="#f85149"/>
  <text x="435" y="286" fill="#f85149" font-size="8" font-weight="600">⚠️ ::before/::after НЕ работают на:</text>
  <text x="435" y="302" fill="#8b949e" font-size="6">&lt;img&gt;, &lt;input&gt;, &lt;br&gt;, &lt;hr&gt; — замещаемые (void) элементы</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Инженерные секреты псевдоклассов и псевдоэлементов</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• :focus-visible заменяет :focus для клавиатурной навигации без визуального мусора от мыши</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• :has(.active) позволяет стилизовать РОДИТЕЛЯ на основе состояния ПОТОМКА (уникально в CSS!)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• ::before/::after — инструмент декоративной графики; для смыслового контента используйте HTML</text>
</svg>