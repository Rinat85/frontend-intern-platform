<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcr13" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcr13)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Адаптивный дизайн и Media Queries</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Mobile First, Breakpoints, @media, viewport meta, container queries, clamp()</text>

  <!-- Left: Mobile First Breakpoints -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Mobile First — Брейкпоинты</text>

  <!-- Mobile -->
  <rect x="35" y="98" width="80" height="130" rx="6" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="75" y="118" fill="#2dff8a" font-size="7" font-weight="600" text-anchor="middle">Mobile</text>
  <text x="75" y="134" fill="#e6edf3" font-size="6" text-anchor="middle">0 – 767px</text>
  <text x="75" y="150" fill="#8b949e" font-size="6" text-anchor="middle">1 колонка</text>
  <text x="75" y="166" fill="#8b949e" font-size="6" text-anchor="middle">Базовые CSS</text>
  <text x="75" y="182" fill="#8b949e" font-size="6" text-anchor="middle">(без @media)</text>
  <text x="75" y="210" fill="#2dff8a" font-size="6" text-anchor="middle">DEFAULT</text>

  <!-- Arrow -->
  <text x="125" y="165" fill="#29e7ff" font-size="16">→</text>

  <!-- Tablet -->
  <rect x="145" y="98" width="100" height="130" rx="6" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="195" y="118" fill="#29e7ff" font-size="7" font-weight="600" text-anchor="middle">Tablet</text>
  <text x="195" y="134" fill="#e6edf3" font-size="6" text-anchor="middle">768px+</text>
  <text x="195" y="150" fill="#8b949e" font-size="6" text-anchor="middle">2 колонки</text>
  <text x="195" y="166" fill="#8b949e" font-size="6" text-anchor="middle">@media</text>
  <text x="195" y="182" fill="#8b949e" font-size="6" text-anchor="middle">(min-width:</text>
  <text x="195" y="194" fill="#8b949e" font-size="6" text-anchor="middle">768px)</text>

  <!-- Arrow -->
  <text x="255" y="165" fill="#29e7ff" font-size="16">→</text>

  <!-- Desktop -->
  <rect x="275" y="98" width="100" height="130" rx="6" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="325" y="118" fill="#ffb02e" font-size="7" font-weight="600" text-anchor="middle">Desktop</text>
  <text x="325" y="134" fill="#e6edf3" font-size="6" text-anchor="middle">1024px+</text>
  <text x="325" y="150" fill="#8b949e" font-size="6" text-anchor="middle">3–4 колонки</text>
  <text x="325" y="166" fill="#8b949e" font-size="6" text-anchor="middle">@media</text>
  <text x="325" y="182" fill="#8b949e" font-size="6" text-anchor="middle">(min-width:</text>
  <text x="325" y="194" fill="#8b949e" font-size="6" text-anchor="middle">1024px)</text>

  <text x="205" y="248" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">Mobile First = min-width (расширяем ВВЕРХ!)</text>
  <text x="205" y="264" fill="#f85149" font-size="7" text-anchor="middle">❌ Desktop First = max-width (сужаем вниз — устарело!)</text>
  <text x="205" y="282" fill="#8b949e" font-size="7" text-anchor="middle">viewport meta: width=device-width, initial-scale=1</text>

  <!-- Right: Modern Responsive Techniques -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Современные техники адаптивности</text>

  <rect x="425" y="98" width="340" height="55" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">clamp(min, preferred, max)</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">font-size: clamp(1rem, 2.5vw, 2rem);</text>
  <text x="435" y="144" fill="#8b949e" font-size="6">Плавно масштабирует шрифт от 16px до 32px без @media!</text>

  <rect x="425" y="160" width="340" height="55" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="178" fill="#29e7ff" font-size="8" font-weight="600">Container Queries (@container)</text>
  <text x="435" y="194" fill="#e6edf3" font-size="7">@container card (min-width: 400px) { ... }</text>
  <text x="435" y="206" fill="#8b949e" font-size="6">Реагирует на размер КОНТЕЙНЕРА, а не экрана!</text>

  <rect x="425" y="222" width="340" height="55" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="240" fill="#ffb02e" font-size="8" font-weight="600">Fluid Typography (vw + rem)</text>
  <text x="435" y="256" fill="#e6edf3" font-size="7">h1 { font-size: calc(1.5rem + 2vw); }</text>
  <text x="435" y="268" fill="#8b949e" font-size="6">Заголовки плавно масштабируются с шириной экрана</text>

  <rect x="425" y="284" width="340" height="30" rx="4" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="435" y="304" fill="#d2a8ff" font-size="8" font-weight="600">picture + srcset: адаптивные изображения по DPR</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Золотое правило Mobile First</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Базовые стили всегда пишутся для мобильного экрана (0px), расширяются для планшетов и ПК через min-width</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• clamp() и auto-fit/auto-fill CSS Grid заменяют до 80% медиа-запросов в современных проектах</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Container Queries — будущее компонентной адаптивности: стиль зависит от карточки, а не от окна!</text>
</svg>