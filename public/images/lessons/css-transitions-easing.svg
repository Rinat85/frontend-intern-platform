<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcte16" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcte16)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Плавные переходы (Transition) и Кривые Безье</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">transition, timing-function, cubic-bezier, steps(), Staggered Delays и аппаратная оптимизация</text>

  <!-- Left: Transition Properties & Pitfalls -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Анатомия transition и Правило 60 FPS</text>

  <rect x="35" y="98" width="340" height="60" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="45" y="116" fill="#2dff8a" font-size="8" font-weight="600">Синтаксис свойства transition:</text>
  <text x="45" y="132" fill="#e6edf3" font-size="7">transition: property duration timing-function delay;</text>
  <text x="45" y="146" fill="#8b949e" font-size="6">transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) 0.05s;</text>

  <rect x="35" y="166" width="340" height="65" rx="4" fill="#f8514922" stroke="#f85149"/>
  <text x="45" y="184" fill="#f85149" font-size="8" font-weight="600">❌ Антипаттерн: transition: all</text>
  <text x="45" y="200" fill="#e6edf3" font-size="7">Анимирует ВСЕ изменяемые свойства (width, margin, color)</text>
  <text x="45" y="214" fill="#8b949e" font-size="6">Вызывает тяжелый Reflow при случайных изменениях. Всегда указывайте точные свойства!</text>

  <rect x="35" y="238" width="340" height="65" rx="4" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="45" y="256" fill="#2dff8a" font-size="8" font-weight="600">✅ Безопасные свойства для анимации:</text>
  <text x="45" y="272" fill="#e6edf3" font-size="7">transform (translate, scale, rotate)  +  opacity</text>
  <text x="45" y="286" fill="#8b949e" font-size="6">Только они интерполируются на GPU со скоростью 60–120 FPS</text>

  <!-- Right: Timing Functions & Bezier -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Функции плавности (Timing Functions)</text>

  <rect x="425" y="98" width="340" height="48" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="114" fill="#2dff8a" font-size="8" font-weight="600">ease / ease-out / ease-in-out:</text>
  <text x="435" y="128" fill="#e6edf3" font-size="7">ease-out — быстрый старт с мягким торможением (для UI кнопок)</text>
  <text x="435" y="138" fill="#8b949e" font-size="6">linear — постоянная скорость (для вращающихся лоадеров-спиннеров)</text>

  <rect x="425" y="152" width="340" height="52" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="168" fill="#29e7ff" font-size="8" font-weight="600">cubic-bezier(x1, y1, x2, y2) — Кастомная кривая:</text>
  <text x="435" y="182" fill="#e6edf3" font-size="7">cubic-bezier(0.34, 1.56, 0.64, 1) — Эффект пружины (Bounce / Spring)!</text>
  <text x="435" y="194" fill="#8b949e" font-size="6">Значение Y &gt; 1 заставляет элемент слегка «перелететь» цель и вернуться</text>

  <rect x="425" y="210" width="340" height="48" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="226" fill="#ffb02e" font-size="8" font-weight="600">steps(n, jump-term) — Пошаговая анимация:</text>
  <text x="435" y="240" fill="#e6edf3" font-size="7">Дискретные кадры для спрайтовых персонажей и мигающего курсора</text>

  <rect x="425" y="264" width="340" height="50" rx="4" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="435" y="280" fill="#d2a8ff" font-size="8" font-weight="600">Staggered Delays (Каскадное появление):</text>
  <text x="435" y="294" fill="#8b949e" font-size="6">li:nth-child(n) { transition-delay: calc(n * 50ms); } — эффект волны</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Инженерные секреты плавных переходов</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Для появления элементов используйте ease-out (150–250ms), для исчезновения — ease-in (100–150ms)</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• cubic-bezier с легким перелетом (y &gt; 1) делает интерфейс живым и тактильно приятным (Snappy Micro-interactions)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• transition срабатывает автоматически при изменении классов в DOM или наведении :hover / :focus-visible</text>
</svg>