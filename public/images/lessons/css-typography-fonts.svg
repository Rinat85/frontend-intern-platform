<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgc6" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgc6)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">CSS: Типографика и Веб-шрифты</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">@font-face, font-display, Variable Fonts, clamp() и вертикальный ритм</text>

  <!-- Left: @font-face &amp; font-display -->
  <rect x="20" y="65" width="370" height="175" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">@font-face и форматы шрифтов</text>
  <rect x="35" y="96" width="340" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="112" fill="#2dff8a" font-size="9">WOFF2 (Web Open Font Format 2)</text>
  <text x="45" y="126" fill="#8b949e" font-size="8">Золотой стандарт: сжатие на 30% лучше WOFF, 99%+ поддержка</text>
  <text x="45" y="138" fill="#ffb02e" font-size="7">TTF, EOT, SVG-шрифты устарели и не требуются!</text>

  <rect x="35" y="150" width="340" height="78" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="45" y="166" fill="#29e7ff" font-size="9" font-weight="600">font-display: swap (устранение FOIT)</text>
  <text x="45" y="180" fill="#e6edf3" font-size="8">• swap: мгновенно показывает системный шрифт, заменяет по загрузке</text>
  <text x="45" y="194" fill="#f85149" font-size="8">• block: невидимый текст до 3 сек (FOIT — Flash of Invisible Text ❌)</text>
  <text x="45" y="208" fill="#8b949e" font-size="8">• optional: если не успел за 100мс — остаётся системный (быстрый UI)</text>

  <!-- Right: Variable Fonts &amp; Clamp -->
  <rect x="410" y="65" width="370" height="175" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="595" y="85" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Вариативные шрифты &amp; clamp()</text>
  
  <rect x="425" y="96" width="340" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="435" y="112" fill="#ffb02e" font-size="9" font-weight="600">Variable Fonts (Вариативный шрифт)</text>
  <text x="435" y="126" fill="#e6edf3" font-size="8">1 компактный файл содержит ВСЕ начертания (100–900 wght, wdth, ital)</text>
  <text x="435" y="140" fill="#2dff8a" font-size="8">font-variation-settings: 'wght' 650; (плавная анимация жирности!)</text>

  <rect x="425" y="162" width="340" height="66" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="178" fill="#ffb02e" font-size="9" font-weight="600">Адаптивный размер: clamp()</text>
  <text x="435" y="192" fill="#d2a8ff" font-size="8">font-size: clamp(1.2rem, 3vw + 0.5rem, 2.5rem);</text>
  <text x="435" y="206" fill="#8b949e" font-size="7">min (1.2rem на мобилках) → плавный рост → max (2.5rem на десктопе)</text>
  <text x="435" y="218" fill="#8b949e" font-size="7">Без единого @media query!</text>

  <!-- Microtypography Rules -->
  <rect x="20" y="250" width="760" height="85" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-width="1"/>
  <text x="400" y="270" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">Правила микротипографики и вертикального ритма</text>
  <rect x="35" y="280" width="225" height="42" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="147" y="296" fill="#29e7ff" font-size="9" text-anchor="middle">line-height: 1.5 (без px!)</text>
  <text x="147" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Масштабируется с размером шрифта</text>
  <rect x="270" y="280" width="240" height="42" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="296" fill="#29e7ff" font-size="9" text-anchor="middle">letter-spacing: -0.02em / 0.05em</text>
  <text x="390" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Плотнее для h1, шире для CAPS</text>
  <rect x="520" y="280" width="245" height="42" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="642" y="296" fill="#29e7ff" font-size="9" text-anchor="middle">rem вместо px</text>
  <text x="642" y="310" fill="#8b949e" font-size="7" text-anchor="middle">Соблюдает зум браузера пользователя</text>

  <!-- Bottom: Font Stack -->
  <rect x="20" y="345" width="760" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="365" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">Идеальный Font Stack для продакшена</text>
  <text x="400" y="382" fill="#e6edf3" font-size="8" text-anchor="middle">font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;</text>
  <text x="400" y="400" fill="#8b949e" font-size="8" text-anchor="middle">Кастомный шрифт → системные шрифты Apple/Windows/Android → общий класс sans-serif</text>
</svg>