<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="14" fill="url(#bg1)"/>
  <rect width="958" height="518" x="1" y="1" rx="13" fill="none" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="40" y="24" width="880" height="44" rx="8" fill="#161f30" stroke="#2a3854"/>
  <text x="480" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    ИМПЕРАТИВНЫЙ (VANILLA JS) vs ДЕКЛАРАТИВНЫЙ (REACT / VUE) ПОДХОД
  </text>

  <!-- LEFT: Imperative -->
  <rect x="40" y="86" width="420" height="400" rx="10" fill="#0d131f" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="40" y="86" width="420" height="36" rx="10" fill="rgba(244,63,94,0.12)"/>
  <text x="250" y="110" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">❌ ИМПЕРАТИВНЫЙ (Vanilla JS)</text>

  <text x="60" y="145" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Пошагово описываем КАК обновить DOM:</text>

  <rect x="55" y="160" width="390" height="300" rx="6" fill="#090d16" stroke="#1e293b"/>
  <text x="70" y="185" fill="#64748b" font-family="monospace" font-size="11">// 1. Найти элемент в дереве DOM</text>
  <text x="70" y="205" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">const</text>
  <text x="113" y="205" fill="#cbd5e1" font-family="monospace" font-size="12"> btn = document.</text>
  <text x="263" y="205" fill="#00e5ff" font-family="monospace" font-size="12">getElementById</text>
  <text x="378" y="205" fill="#cbd5e1" font-family="monospace" font-size="12">(</text>
  <text x="385" y="205" fill="#7ee787" font-family="monospace" font-size="12">'btn'</text>
  <text x="415" y="205" fill="#cbd5e1" font-family="monospace" font-size="12">);</text>

  <text x="70" y="235" fill="#64748b" font-family="monospace" font-size="11">// 2. Подписаться на событие</text>
  <text x="70" y="255" fill="#cbd5e1" font-family="monospace" font-size="12">btn.</text>
  <text x="100" y="255" fill="#00e5ff" font-family="monospace" font-size="12">addEventListener</text>
  <text x="228" y="255" fill="#cbd5e1" font-family="monospace" font-size="12">(</text>
  <text x="235" y="255" fill="#7ee787" font-family="monospace" font-size="12">'click'</text>
  <text x="280" y="255" fill="#cbd5e1" font-family="monospace" font-size="12">, () =&gt; {</text>

  <text x="85" y="280" fill="#64748b" font-family="monospace" font-size="11">// 3. Вручную обновить DOM</text>
  <text x="85" y="300" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">  const</text>
  <text x="133" y="300" fill="#cbd5e1" font-family="monospace" font-size="12"> el = document.</text>
  <text x="265" y="300" fill="#00e5ff" font-family="monospace" font-size="12">querySelector</text>
  <text x="360" y="300" fill="#cbd5e1" font-family="monospace" font-size="12">(</text>
  <text x="367" y="300" fill="#7ee787" font-family="monospace" font-size="12">'.count'</text>
  <text x="415" y="300" fill="#cbd5e1" font-family="monospace" font-size="12">);</text>

  <text x="85" y="325" fill="#cbd5e1" font-family="monospace" font-size="12">  count++;</text>
  <text x="85" y="350" fill="#cbd5e1" font-family="monospace" font-size="12">  el.</text>
  <text x="115" y="350" fill="#f59e0b" font-family="monospace" font-size="12">textContent</text>
  <text x="205" y="350" fill="#cbd5e1" font-family="monospace" font-size="12"> = count;</text>

  <text x="85" y="375" fill="#64748b" font-family="monospace" font-size="11">  // 4. Управлять CSS вручную</text>
  <text x="85" y="395" fill="#cbd5e1" font-family="monospace" font-size="12">  el.</text>
  <text x="112" y="395" fill="#f59e0b" font-family="monospace" font-size="12">classList</text>
  <text x="175" y="395" fill="#cbd5e1" font-family="monospace" font-size="12">.toggle(</text>
  <text x="240" y="395" fill="#7ee787" font-family="monospace" font-size="12">'active'</text>
  <text x="295" y="395" fill="#cbd5e1" font-family="monospace" font-size="12">);</text>
  <text x="70" y="420" fill="#cbd5e1" font-family="monospace" font-size="12">});</text>

  <text x="70" y="448" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">⚠ Рассинхрон состояния и DOM при масштабировании</text>

  <!-- RIGHT: Declarative -->
  <rect x="500" y="86" width="420" height="400" rx="10" fill="#0d131f" stroke="#10b981" stroke-width="1.5"/>
  <rect x="500" y="86" width="420" height="36" rx="10" fill="rgba(16,185,129,0.12)"/>
  <text x="710" y="110" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">✅ ДЕКЛАРАТИВНЫЙ (React)</text>

  <text x="520" y="145" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Описываем ЧТО должно отображаться (UI = f(State)):</text>

  <rect x="515" y="160" width="390" height="300" rx="6" fill="#090d16" stroke="#1e293b"/>

  <text x="530" y="185" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">function</text>
  <text x="600" y="185" fill="#00e5ff" font-family="monospace" font-size="12"> Counter</text>
  <text x="665" y="185" fill="#cbd5e1" font-family="monospace" font-size="12">() {</text>

  <text x="540" y="215" fill="#64748b" font-family="monospace" font-size="11">// Реактивное состояние</text>
  <text x="540" y="240" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">const</text>
  <text x="580" y="240" fill="#cbd5e1" font-family="monospace" font-size="12"> [count, setCount] =</text>
  <text x="540" y="260" fill="#cbd5e1" font-family="monospace" font-size="12">    </text>
  <text x="560" y="260" fill="#00e5ff" font-family="monospace" font-size="12">useState</text>
  <text x="625" y="260" fill="#cbd5e1" font-family="monospace" font-size="12">(</text>
  <text x="633" y="260" fill="#7ee787" font-family="monospace" font-size="12">0</text>
  <text x="643" y="260" fill="#cbd5e1" font-family="monospace" font-size="12">);</text>

  <text x="540" y="295" fill="#64748b" font-family="monospace" font-size="11">// Декларативный JSX (UI = f(state))</text>
  <text x="540" y="320" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">return</text>
  <text x="585" y="320" fill="#cbd5e1" font-family="monospace" font-size="12"> (</text>

  <text x="555" y="345" fill="#a855f7" font-family="monospace" font-size="12">&lt;div&gt;</text>
  <text x="565" y="370" fill="#a855f7" font-family="monospace" font-size="12">  &lt;span</text>
  <text x="625" y="370" fill="#f59e0b" font-family="monospace" font-size="12"> className=</text>
  <text x="717" y="370" fill="#7ee787" font-family="monospace" font-size="12">"count"</text>
  <text x="767" y="370" fill="#a855f7" font-family="monospace" font-size="12">&gt;</text>
  <text x="776" y="370" fill="#cbd5e1" font-family="monospace" font-size="12">{count}</text>
  <text x="823" y="370" fill="#a855f7" font-family="monospace" font-size="12">&lt;/span&gt;</text>

  <text x="565" y="395" fill="#a855f7" font-family="monospace" font-size="12">  &lt;button</text>
  <text x="640" y="395" fill="#f59e0b" font-family="monospace" font-size="12"> onClick=</text>
  <text x="720" y="395" fill="#cbd5e1" font-family="monospace" font-size="12">{() =&gt;</text>

  <text x="580" y="418" fill="#cbd5e1" font-family="monospace" font-size="12">    </text>
  <text x="600" y="418" fill="#00e5ff" font-family="monospace" font-size="12">setCount</text>
  <text x="665" y="418" fill="#cbd5e1" font-family="monospace" font-size="12">(c =&gt; c + 1)}&gt;</text>
  <text x="780" y="418" fill="#a855f7" font-family="monospace" font-size="12">+&lt;/button&gt;</text>

  <text x="555" y="443" fill="#a855f7" font-family="monospace" font-size="12">&lt;/div&gt;</text>

  <text x="520" y="448" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">✓ DOM обновляется автоматически при изменении State</text>

  <!-- Central Arrow -->
  <rect x="448" y="240" width="64" height="64" rx="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="278" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">→</text>
</svg>