<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="14" fill="url(#bgC)"/>
  <rect width="958" height="558" x="1" y="1" rx="13" fill="none" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="40" y="24" width="880" height="44" rx="8" fill="#161f30" stroke="#2a3854"/>
  <text x="480" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    СРАВНЕНИЕ ФРЕЙМВОРКОВ: REACT vs VUE 3 vs ANGULAR vs SVELTE
  </text>

  <!-- Table Header Row -->
  <rect x="40" y="84" width="150" height="40" rx="0" fill="#1e293b"/>
  <text x="115" y="108" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Критерий</text>

  <rect x="190" y="84" width="190" height="40" rx="0" fill="rgba(97,218,251,0.1)"/>
  <text x="285" y="108" fill="#61dafb" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">⚛ React 19</text>

  <rect x="380" y="84" width="190" height="40" rx="0" fill="rgba(66,184,131,0.1)"/>
  <text x="475" y="108" fill="#42b883" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🟢 Vue 3</text>

  <rect x="570" y="84" width="190" height="40" rx="0" fill="rgba(221,0,49,0.1)"/>
  <text x="665" y="108" fill="#dd0031" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🔺 Angular 18+</text>

  <rect x="760" y="84" width="160" height="40" rx="0" fill="rgba(255,62,0,0.1)"/>
  <text x="840" y="108" fill="#ff3e00" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🔥 Svelte 5</text>

  <!-- Row 1: Paradigm -->
  <rect x="40" y="124" width="150" height="52" fill="#131c2d" stroke="#1e293b" stroke-width="0.5"/>
  <text x="52" y="146" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Парадигма</text>
  <text x="52" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">(Архитектура)</text>

  <rect x="190" y="124" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="205" y="146" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Библиотека (View layer)</text>
  <text x="205" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">«Конструктор» — собирай сам</text>

  <rect x="380" y="124" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="395" y="146" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Прогрессивный фреймворк</text>
  <text x="395" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Масштабируй по мере роста</text>

  <rect x="570" y="124" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="585" y="146" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Full framework (Batteries)</text>
  <text x="585" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Всё включено + TypeScript</text>

  <rect x="760" y="124" width="160" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="775" y="146" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Компилятор</text>
  <text x="775" y="162" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Compile-time реактивность</text>

