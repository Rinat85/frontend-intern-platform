  <text x="52" y="198" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Реактивность</text>
  <text x="52" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">(Обновление DOM)</text>

  <rect x="190" y="176" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="205" y="198" fill="#61dafb" font-family="monospace" font-size="11">Virtual DOM + Diffing</text>
  <text x="205" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Fiber Tree рекончиляция</text>

  <rect x="380" y="176" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="395" y="198" fill="#42b883" font-family="monospace" font-size="11">Proxy-based Reactivity</text>
  <text x="395" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Track / Trigger + VNode</text>

  <rect x="570" y="176" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="585" y="198" fill="#dd0031" font-family="monospace" font-size="11">Zone.js → Signals</text>
  <text x="585" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Change Detection → Signals</text>

  <rect x="760" y="176" width="160" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="775" y="198" fill="#ff3e00" font-family="monospace" font-size="11">Runes ($state)</text>
  <text x="775" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Без Virtual DOM</text>

