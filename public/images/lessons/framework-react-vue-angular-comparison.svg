  <rect x="760" y="384" width="160" height="68" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="775" y="406" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Apple Music (Web),</text>
  <text x="775" y="422" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">1Password, Spotify</text>
