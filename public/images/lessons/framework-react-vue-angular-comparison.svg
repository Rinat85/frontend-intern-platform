  <rect x="380" y="332" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="395" y="354" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">🟢 Низкий</text>
  <text x="395" y="370" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Самый простой старт</text>

  <rect x="570" y="332" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
