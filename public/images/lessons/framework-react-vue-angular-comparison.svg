  <rect x="570" y="228" width="190" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="585" y="250" fill="#dd0031" font-family="monospace" font-size="11">@Component + HTML Template</text>
  <text x="585" y="266" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Декораторы + DI</text>

  <rect x="760" y="228" width="160" height="52" fill="#0d131f" stroke="#1e293b" stroke-width="0.5"/>
  <text x="775" y="250" fill="#ff3e00" font-family="monospace" font-size="11">.svelte файлы</text>
  <text x="775" y="266" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">HTML с {выражениями}</text>

