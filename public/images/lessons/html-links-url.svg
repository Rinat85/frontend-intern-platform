<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgl6" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgl6)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">HTML: Анатомия URL и Гиперссылок</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Структура URL, безопасность target="_blank" и специальные протоколы</text>

  <!-- URL Breakdown Box -->
  <rect x="20" y="65" width="760" height="90" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="400" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Полная структура URL-адреса</text>
  
  <!-- URL Parts -->
  <rect x="35" y="98" width="90" height="32" rx="4" fill="#161b22" stroke="#30363d"/><text x="80" y="114" fill="#2dff8a" font-size="10" text-anchor="middle">https://</text><text x="80" y="125" fill="#8b949e" font-size="7" text-anchor="middle">протокол</text>
  <rect x="130" y="98" width="165" height="32" rx="4" fill="#161b22" stroke="#30363d"/><text x="212" y="114" fill="#29e7ff" font-size="10" text-anchor="middle">api.academy.ru:443</text><text x="212" y="125" fill="#8b949e" font-size="7" text-anchor="middle">субдомен + домен + порт</text>
  <rect x="300" y="98" width="150" height="32" rx="4" fill="#161b22" stroke="#30363d"/><text x="375" y="114" fill="#ffb02e" font-size="10" text-anchor="middle">/courses/frontend</text><text x="375" y="125" fill="#8b949e" font-size="7" text-anchor="middle">путь (path)</text>
  <rect x="455" y="98" width="185" height="32" rx="4" fill="#161b22" stroke="#30363d"/><text x="547" y="114" fill="#d2a8ff" font-size="10" text-anchor="middle">?sort=asc&amp;page=2</text><text x="547" y="125" fill="#8b949e" font-size="7" text-anchor="middle">query-параметры</text>
  <rect x="645" y="98" width="120" height="32" rx="4" fill="#161b22" stroke="#30363d"/><text x="705" y="114" fill="#f85149" font-size="10" text-anchor="middle">#lesson-6</text><text x="705" y="125" fill="#8b949e" font-size="7" text-anchor="middle">якорь (hash)</text>

  <!-- Left: Target &amp; Security -->
  <rect x="20" y="168" width="370" height="155" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="205" y="188" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Безопасность внешних ссылок</text>
  <rect x="35" y="200" width="340" height="36" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="218" fill="#ffb02e" font-size="9">target="_blank"</text>
  <text x="175" y="218" fill="#8b949e" font-size="8">→ открытие в новой вкладке</text>
  <text x="45" y="230" fill="#f85149" font-size="8">⚠️ Уязвимость: Tabnabbing (доступ к window.opener)</text>
  <rect x="35" y="244" width="340" height="42" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="45" y="260" fill="#2dff8a" font-size="9">rel="noopener noreferrer"</text>
  <text x="45" y="275" fill="#e6edf3" font-size="8">✅ noopener: блокирует window.opener (защита)</text>
  <text x="45" y="285" fill="#8b949e" font-size="7">noreferrer: скрывает заголовок Referer</text>
  <text x="205" y="312" fill="#8b949e" font-size="8" text-anchor="middle">SEO: rel="nofollow" / rel="sponsored" / rel="ugc"</text>

  <!-- Right: Protocols -->
  <rect x="410" y="168" width="370" height="155" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="595" y="188" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Специальные протоколы</text>
  <rect x="425" y="200" width="165" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="507" y="218" fill="#29e7ff" font-size="10" font-weight="600" text-anchor="middle">tel:+78005553535</text>
  <text x="507" y="234" fill="#8b949e" font-size="8" text-anchor="middle">Звонок со смартфона</text>
  <rect x="600" y="200" width="165" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="682" y="218" fill="#29e7ff" font-size="10" font-weight="600" text-anchor="middle">mailto:hr@site.ru</text>
  <text x="682" y="234" fill="#8b949e" font-size="8" text-anchor="middle">Письмо в почтовом клиенте</text>
  <rect x="425" y="256" width="165" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="507" y="274" fill="#29e7ff" font-size="10" font-weight="600" text-anchor="middle">href="#section-id"</text>
  <text x="507" y="290" fill="#8b949e" font-size="8" text-anchor="middle">Якорный скролл на странице</text>
  <rect x="600" y="256" width="165" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="682" y="274" fill="#29e7ff" font-size="10" font-weight="600" text-anchor="middle">download="file.pdf"</text>
  <text x="682" y="290" fill="#8b949e" font-size="8" text-anchor="middle">Принудительное скачивание</text>

  <!-- Bottom: Tips -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Советы Senior по ссылкам и доступности</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Ссылка «Skip to content» (&lt;a href="#main" class="sr-only"&gt;) позволяет незрячим пользователям пропустить шапку</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• В tel: всегда указывайте международный номер (+7...) без скобок и дефисов для безошибочного набора</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Не используйте ссылки-пустышки &lt;a href="#"&gt; вместо кнопок — для действий в интерфейсе используйте &lt;button&gt;</text>
</svg>