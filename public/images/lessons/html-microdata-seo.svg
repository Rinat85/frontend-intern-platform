<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgh11" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgh11)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">HTML: Микроразметка, SEO и Метаданные</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Schema.org (JSON-LD), Open Graph, Canonical, robots.txt, sitemap.xml и Rich Snippets</text>

  <!-- Left: Schema.org JSON-LD -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Schema.org через JSON-LD</text>

  <rect x="35" y="98" width="340" height="135" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="114" fill="#8b949e" font-size="7">&lt;script type="application/ld+json"&gt;</text>
  <text x="45" y="128" fill="#2dff8a" font-size="7">{</text>
  <text x="55" y="142" fill="#29e7ff" font-size="7">  "@context": "https://schema.org",</text>
  <text x="55" y="156" fill="#29e7ff" font-size="7">  "@type": "Course",</text>
  <text x="55" y="170" fill="#e6edf3" font-size="7">  "name": "Frontend Intern Platform",</text>
  <text x="55" y="184" fill="#ffb02e" font-size="7">  "provider": { "@type": "Organization", "name": "Academy" },</text>
  <text x="55" y="198" fill="#ff2bd6" font-size="7">  "aggregateRating": { "ratingValue": "4.9", "reviewCount": "120" }</text>
  <text x="45" y="212" fill="#2dff8a" font-size="7">}</text>
  <text x="45" y="226" fill="#8b949e" font-size="7">&lt;/script&gt;</text>

  <rect x="35" y="242" width="340" height="70" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="205" y="260" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">Результат в Google &amp; Яндекс:</text>
  <text x="205" y="278" fill="#ffb02e" font-size="8" text-anchor="middle">⭐️⭐️⭐️⭐️⭐️ 4.9 (120 отзывов) • Бесплатно • 60 часов</text>
  <text x="205" y="296" fill="#8b949e" font-size="7" text-anchor="middle">Rich Snippets увеличивают CTR кликов из поиска на +35%!</text>

  <!-- Right: Open Graph & Canonical -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Open Graph, Canonical &amp; SEO</text>

  <rect x="425" y="98" width="340" height="68" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="114" fill="#29e7ff" font-size="8" font-weight="600">Open Graph (Telegram, VK, Twitter):</text>
  <text x="435" y="130" fill="#e6edf3" font-size="7">&lt;meta property="og:title" content="..." /&gt;</text>
  <text x="435" y="144" fill="#e6edf3" font-size="7">&lt;meta property="og:image" content="/og-banner.png" /&gt;</text>
  <text x="435" y="158" fill="#8b949e" font-size="6">Генерирует красивую карточку-превью при шеринге ссылки</text>

  <rect x="425" y="174" width="340" height="68" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="190" fill="#ffb02e" font-size="8" font-weight="600">Канонический URL (Canonical):</text>
  <text x="435" y="206" fill="#e6edf3" font-size="7">&lt;link rel="canonical" href="https://site.dev/course" /&gt;</text>
  <text x="435" y="220" fill="#8b949e" font-size="7">Защищает от дублей страниц с UTM-метками (?utm_source=...)</text>

  <rect x="425" y="250" width="340" height="65" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="435" y="266" fill="#d2a8ff" font-size="8" font-weight="600">robots.txt &amp; sitemap.xml:</text>
  <text x="435" y="282" fill="#e6edf3" font-size="7">User-agent: *  |  Disallow: /admin/  |  Sitemap: /sitemap.xml</text>
  <text x="435" y="298" fill="#8b949e" font-size="6">Управляет индексацией и краулинговым бюджетом поисковиков</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Финал HTML Трека: Полный комплекс поисковой оптимизации</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• JSON-LD — стандарт Google для разметки курсов, статей, товаров, FAQ и хлебных крошек</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Всегда указывайте абсолютный URL для og:image (https://domain.com/og.png с соотношением 1200x630)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Добавляйте rel="canonical" на каждую страницу для объединения веса ссылок</text>
</svg>