<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgh10" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgh10)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">HTML: Семантическая Архитектура Веб-Документа</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">header, nav, main, article, section, aside, footer, WAI-ARIA Landmarks и SEO</text>

  <!-- Page Blueprint -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Анатомия семантической страницы (HTML5)</text>

  <!-- Header -->
  <rect x="35" y="96" width="430" height="32" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="50" y="116" fill="#2dff8a" font-size="9" font-weight="600">&lt;header role="banner"&gt;</text>
  <text x="250" y="116" fill="#8b949e" font-size="8">&lt;nav role="navigation"&gt; Логотип + Меню &lt;/nav&gt;</text>

  <!-- Main Container -->
  <rect x="35" y="134" width="300" height="135" rx="4" fill="#161b22" stroke="#29e7ff"/>
  <text x="50" y="152" fill="#29e7ff" font-size="9" font-weight="600">&lt;main role="main"&gt; (Единственный на страницу!)</text>

  <!-- Article inside Main -->
  <rect x="45" y="160" width="280" height="48" rx="3" fill="#0d1117" stroke="#30363d"/>
  <text x="55" y="176" fill="#ffb02e" font-size="8" font-weight="600">&lt;article&gt; Автономный контент (пост, товар)</text>
  <text x="55" y="194" fill="#8b949e" font-size="7">&lt;h1&gt; Главный заголовок &lt;time datetime="..."&gt; &lt;/article&gt;</text>

  <!-- Section inside Main -->
  <rect x="45" y="214" width="280" height="45" rx="3" fill="#0d1117" stroke="#30363d"/>
  <text x="55" y="232" fill="#ff2bd6" font-size="8" font-weight="600">&lt;section&gt; Тематический блок с &lt;h2&gt;</text>
  <text x="55" y="246" fill="#8b949e" font-size="7">Комментарии, характеристики, отзывы</text>

  <!-- Aside (Sidebar) -->
  <rect x="345" y="134" width="120" height="135" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="405" y="156" fill="#ffb02e" font-size="8" font-weight="600" text-anchor="middle">&lt;aside&gt;</text>
  <text x="405" y="174" fill="#8b949e" font-size="7" text-anchor="middle">role="complementary"</text>
  <text x="405" y="196" fill="#e6edf3" font-size="7" text-anchor="middle">Сайдбар</text>
  <text x="405" y="210" fill="#e6edf3" font-size="7" text-anchor="middle">Реклама</text>
  <text x="405" y="224" fill="#e6edf3" font-size="7" text-anchor="middle">Теги / Похожее</text>

  <!-- Footer -->
  <rect x="35" y="275" width="430" height="36" rx="4" fill="#161b22" stroke="#d2a8ff"/>
  <text x="50" y="297" fill="#d2a8ff" font-size="8" font-weight="600">&lt;footer role="contentinfo"&gt;</text>
  <text x="250" y="297" fill="#8b949e" font-size="7">Копирайт, &lt;address&gt;, карта сайта, контакты</text>

  <!-- Right: Semantic Benefits & Rules -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">4 Столпа Семантики</text>

  <rect x="515" y="98" width="250" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="116" fill="#29e7ff" font-size="8" font-weight="600">1. Доступность (a11y / WCAG)</text>
  <text x="525" y="132" fill="#8b949e" font-size="7">Скринридеры прыгают по ориентирам</text>

  <rect x="515" y="154" width="250" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="172" fill="#2dff8a" font-size="8" font-weight="600">2. SEO &amp; Rich Snippets</text>
  <text x="525" y="188" fill="#8b949e" font-size="7">Поисковики понимают структуру</text>

  <rect x="515" y="210" width="250" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="228" fill="#ffb02e" font-size="8" font-weight="600">3. Safari Reader Mode</text>
  <text x="525" y="244" fill="#8b949e" font-size="7">Авто-очистка статьи для чтения</text>

  <rect x="515" y="266" width="250" height="46" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="525" y="284" fill="#ff2bd6" font-size="8" font-weight="600">4. Иерархия h1 → h2 → h3</text>
  <text x="525" y="298" fill="#8b949e" font-size="6">Строго 1 тег &lt;h1&gt; на страницу!</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Разница &lt;article&gt; vs &lt;section&gt; vs &lt;div&gt;</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• &lt;article&gt; — самодостаточный материал: его можно скопировать и опубликовать на другом сайте (пост, карточка товара)</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• &lt;section&gt; — смысловой раздел документа, ОБЯЗАТЕЛЬНО должен содержать заголовок (&lt;h2&gt;–&lt;h6&gt;)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• &lt;div&gt; — чисто визуальная обёртка для стилизации CSS (не несет никакой семантической нагрузки)</text>
</svg>