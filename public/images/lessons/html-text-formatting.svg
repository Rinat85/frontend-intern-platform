<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bg5h" x1="0" y1="0" x2="800" y2="430" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="430" fill="url(#bg5h)" rx="12"/>
  <text x="400" y="32" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">HTML: Теги форматирования текста</text>
  <text x="400" y="50" fill="#8b949e" font-size="10" text-anchor="middle">Семантические vs презентационные теги и их роль в SEO и a11y</text>
  <rect x="20" y="68" width="370" height="160" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="205" y="88" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Семантические теги (Meaning)</text>
  <rect x="32" y="100" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="114" y="118" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">&lt;strong&gt;</text><text x="114" y="136" fill="#8b949e" font-size="8" text-anchor="middle">Важный текст / ударение</text>
  <rect x="210" y="100" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="292" y="118" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">&lt;em&gt;</text><text x="292" y="136" fill="#8b949e" font-size="8" text-anchor="middle">Смысловой акцент / интонация</text>
  <rect x="32" y="156" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="114" y="174" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">&lt;mark&gt;</text><text x="114" y="192" fill="#8b949e" font-size="8" text-anchor="middle">Выделение / подсветка</text>
  <rect x="210" y="156" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="292" y="174" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">&lt;abbr&gt;</text><text x="292" y="192" fill="#8b949e" font-size="8" text-anchor="middle">Аббревиатура + title</text>
  <rect x="410" y="68" width="370" height="160" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="595" y="88" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Визуальные теги (Styling)</text>
  <rect x="422" y="100" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="504" y="118" fill="#ff7b72" font-size="11" font-weight="600" text-anchor="middle">&lt;b&gt;</text><text x="504" y="136" fill="#8b949e" font-size="8" text-anchor="middle">Полужирный без семантики</text>
  <rect x="600" y="100" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="682" y="118" fill="#ff7b72" font-size="11" font-weight="600" text-anchor="middle">&lt;i&gt;</text><text x="682" y="136" fill="#8b949e" font-size="8" text-anchor="middle">Курсив без семантики</text>
  <rect x="422" y="156" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="504" y="174" fill="#ff7b72" font-size="11" font-weight="600" text-anchor="middle">&lt;s&gt;</text><text x="504" y="192" fill="#8b949e" font-size="8" text-anchor="middle">Зачёркнутый текст</text>
  <rect x="600" y="156" width="165" height="48" rx="6" fill="#0d1117" stroke="#30363d"/><text x="682" y="174" fill="#ff7b72" font-size="11" font-weight="600" text-anchor="middle">&lt;small&gt;</text><text x="682" y="192" fill="#8b949e" font-size="8" text-anchor="middle">Мелкий шрифт / дисклеймер</text>
  <rect x="20" y="245" width="760" height="70" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="400" y="265" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Технические и кодовые теги</text>
  <rect x="32" y="278" width="100" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="82" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;code&gt;</text>
  <rect x="144" y="278" width="100" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="194" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;pre&gt;</text>
  <rect x="256" y="278" width="100" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="306" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;kbd&gt;</text>
  <rect x="368" y="278" width="100" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="418" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;samp&gt;</text>
  <rect x="480" y="278" width="100" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="530" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;var&gt;</text>
  <rect x="592" y="278" width="175" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="679" y="296" fill="#d2a8ff" font-size="10" text-anchor="middle">&lt;blockquote&gt; + &lt;cite&gt;</text>
  <rect x="20" y="335" width="370" height="80" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-dasharray="4,3"/>
  <text x="205" y="355" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">Используйте семантические теги</text>
  <text x="205" y="374" fill="#e6edf3" font-size="9" text-anchor="middle">strong вместо b, em вместо i</text>
  <text x="205" y="392" fill="#8b949e" font-size="8" text-anchor="middle">Улучшает SEO, доступность и читаемость</text>
  <rect x="410" y="335" width="370" height="80" rx="8" fill="#0d1117" stroke="#f85149" stroke-dasharray="4,3"/>
  <text x="595" y="355" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">b и i — только для визуала</text>
  <text x="595" y="374" fill="#e6edf3" font-size="9" text-anchor="middle">Логотипы, названия кораблей,</text>
  <text x="595" y="392" fill="#8b949e" font-size="8" text-anchor="middle">иностранные термины, артикулы</text>
</svg>