<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgja12" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgja12)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">JS: Event Loop, Microtasks, Promises и Async/Await</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Call Stack, Web APIs, Microtask Queue (Promises), Task Queue (Timers) и Promise Combinators</text>

  <!-- Left: Event Loop Architecture -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Архитектура Event Loop в JavaScript</text>

  <!-- Call Stack -->
  <rect x="35" y="100" width="130" height="140" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="100" y="118" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">1. Call Stack (Стек)</text>
  <rect x="45" y="130" width="110" height="24" rx="3" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="100" y="146" fill="#2dff8a" font-size="7" text-anchor="middle">fetchData()</text>
  <rect x="45" y="160" width="110" height="24" rx="3" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="100" y="176" fill="#29e7ff" font-size="7" text-anchor="middle">main()</text>
  <text x="100" y="210" fill="#8b949e" font-size="6" text-anchor="middle">Синхронный код (LIFO)</text>

  <!-- Web APIs -->
  <rect x="180" y="100" width="130" height="140" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="245" y="118" fill="#ffb02e" font-size="8" font-weight="600" text-anchor="middle">2. Web APIs</text>
  <text x="245" y="140" fill="#e6edf3" font-size="7" text-anchor="middle">fetch() / HTTP</text>
  <text x="245" y="160" fill="#e6edf3" font-size="7" text-anchor="middle">setTimeout()</text>
  <text x="245" y="180" fill="#e6edf3" font-size="7" text-anchor="middle">DOM Events</text>
  <text x="245" y="210" fill="#8b949e" font-size="6" text-anchor="middle">Фоновые потоки C++</text>

  <!-- Queues -->
  <rect x="325" y="100" width="140" height="65" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="395" y="118" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">3. Microtasks (VIP!)</text>
  <text x="395" y="134" fill="#2dff8a" font-size="7" text-anchor="middle">Promise.then()</text>
  <text x="395" y="148" fill="#2dff8a" font-size="7" text-anchor="middle">async / await</text>

  <rect x="325" y="175" width="140" height="65" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="395" y="193" fill="#ffb02e" font-size="8" font-weight="600" text-anchor="middle">4. Macrotasks</text>
  <text x="395" y="209" fill="#8b949e" font-size="7" text-anchor="middle">setTimeout / setInterval</text>
  <text x="395" y="223" fill="#8b949e" font-size="7" text-anchor="middle">setImmediate (Node)</text>

  <text x="250" y="260" fill="#2dff8a" font-size="8" text-anchor="middle">ПРИОРИТЕТ: Стек → ВСЕ Микротаски (Promises) → Рендеринг → 1 Макротаска</text>

  <!-- Right: Promise Combinators -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Promise Combinators</text>

  <rect x="515" y="98" width="250" height="48" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="525" y="114" fill="#2dff8a" font-size="8" font-weight="600">Promise.all([p1, p2])</text>
  <text x="525" y="128" fill="#8b949e" font-size="7">Ждет все. Падает при первой ошибке</text>

  <rect x="515" y="152" width="250" height="48" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="525" y="168" fill="#29e7ff" font-size="8" font-weight="600">Promise.allSettled([p1, p2])</text>
  <text x="525" y="182" fill="#8b949e" font-size="7">Дожидается ВСЕХ (успех и ошибки)</text>

  <rect x="515" y="206" width="250" height="48" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="525" y="222" fill="#ffb02e" font-size="8" font-weight="600">Promise.race([p1, p2])</text>
  <text x="525" y="236" fill="#8b949e" font-size="7">Гонка: возвращает первый результат</text>

  <rect x="515" y="260" width="250" height="48" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="525" y="276" fill="#ff2bd6" font-size="8" font-weight="600">Promise.any([p1, p2])</text>
  <text x="525" y="290" fill="#8b949e" font-size="7">Возвращает первый УСПЕШНЫЙ</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Главный секрет: почему Promise быстрее setTimeout(..., 0)</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Промисы и async/await попадают в очередь Microtask Queue с наивысшим приоритетом</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Event Loop полностью опустошает очередь Microtasks перед выполнением ЛЮБОЙ макротаски (setTimeout)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Используйте Promise.all() для параллельных независимых запросов вместо последовательных await!</text>
</svg>