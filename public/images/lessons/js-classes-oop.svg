<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgjo11" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgjo11)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">JS: Классы в ES6+ и Объектно-Ориентированное Программирование</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">class, constructor, extends, super, приватные поля #private, get/set и static</text>

  <!-- Left: Class Anatomy -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Анатомия ES6+ Класса</text>

  <rect x="35" y="98" width="340" height="215" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="116" fill="#2dff8a" font-size="8" font-weight="600">class User {</text>
  <text x="55" y="132" fill="#f85149" font-size="8">  #password; // Приватное поле (#)!</text>
  <text x="55" y="148" fill="#ffb02e" font-size="8">  static count = 0; // Статическое поле</text>
  <text x="55" y="164" fill="#e6edf3" font-size="8">  constructor(name, pass) {</text>
  <text x="65" y="178" fill="#29e7ff" font-size="7">    this.name = name;</text>
  <text x="65" y="192" fill="#f85149" font-size="7">    this.#password = pass;</text>
  <text x="65" y="206" fill="#ffb02e" font-size="7">    User.count++;</text>
  <text x="55" y="220" fill="#e6edf3" font-size="8">  }</text>
  <text x="55" y="236" fill="#2dff8a" font-size="8">  get isStrongPass() { return this.#password.length &gt;= 8; }</text>
  <text x="55" y="252" fill="#d2a8ff" font-size="8">  static createGuest() { return new User('Гость', '123'); }</text>
  <text x="45" y="268" fill="#2dff8a" font-size="8">}</text>

  <!-- Right: Inheritance & super -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Наследование: extends &amp; super</text>

  <rect x="425" y="98" width="340" height="145" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">class Admin extends User {</text>
  <text x="445" y="132" fill="#ffb02e" font-size="8">  constructor(name, pass, role) {</text>
  <text x="455" y="148" fill="#2dff8a" font-size="8">    super(name, pass); // Вызов User constructor!</text>
  <text x="455" y="164" fill="#29e7ff" font-size="7">    this.role = role;</text>
  <text x="445" y="178" fill="#ffb02e" font-size="8">  }</text>
  <text x="445" y="194" fill="#d2a8ff" font-size="8">  deleteDatabase() { /* Доступно только админу */ }</text>
  <text x="435" y="210" fill="#2dff8a" font-size="8">}</text>

  <rect x="425" y="252" width="340" height="60" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="435" y="270" fill="#29e7ff" font-size="8" font-weight="600">Правило super():</text>
  <text x="435" y="286" fill="#e6edf3" font-size="7">В дочернем классе НЕЛЬЗЯ использовать this до вызова super()!</text>
  <text x="435" y="300" fill="#8b949e" font-size="6">ReferenceError: Must call super constructor in derived class</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Приватность ES2022 (#field) vs замыкания</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Поля с решеткой #password являются по-настоящему приватными на уровне движка V8</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Попытка прочитать user.#password снаружи класса вызовет синтаксическую ошибку SyntaxError</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• static методы вызываются напрямую у класса: User.createGuest(), а не у экземпляра!</text>
</svg>