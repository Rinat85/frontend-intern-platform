<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#0a0e13; font-family:'JetBrains Mono', Consolas, monospace;">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dff8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#29e7ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#2dff8a" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1">JavaScript Loops &amp; Control Flow</text>
  <text x="500" y="72" fill="#8b949e" font-size="13" text-anchor="middle">Сравнение механизмов итерации: for...of vs for...in vs Array methods</text>

  <!-- Column 1: for...of -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="440" height="270" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-width="2"/>
    <rect width="440" height="40" rx="8" fill="#161b22"/>
    <text x="20" y="26" fill="#2dff8a" font-size="16" font-weight="bold">for...of — По ЗНАЧЕНИЯМ</text>
    <rect x="330" y="10" width="90" height="20" rx="4" fill="rgba(45,255,138,0.15)" stroke="#2dff8a" stroke-width="1"/>
    <text x="375" y="24" fill="#2dff8a" font-size="11" text-anchor="middle">Iterables</text>

    <text x="20" y="65" fill="#e6edf3" font-size="13">• Работает с объектами с [Symbol.iterator]</text>
    <text x="20" y="88" fill="#8b949e" font-size="12">  (Array, Map, Set, String, TypedArray, NodeList)</text>
    
    <rect x="20" y="105" width="400" height="85" rx="6" fill="#03060a" stroke="#30363d"/>
    <text x="35" y="130" fill="#ff7b72" font-size="12">const</text>
    <text x="75" y="130" fill="#e6edf3" font-size="12">skills = [</text>
    <text x="145" y="130" fill="#a5d6ff" font-size="12">'HTML'</text>
    <text x="190" y="130" fill="#e6edf3" font-size="12">, </text>
    <text x="200" y="130" fill="#a5d6ff" font-size="12">'CSS'</text>
    <text x="235" y="130" fill="#e6edf3" font-size="12">, </text>
    <text x="245" y="130" fill="#a5d6ff" font-size="12">'JS'</text>
    <text x="265" y="130" fill="#e6edf3" font-size="12">];</text>
    <text x="35" y="155" fill="#ff7b72" font-size="12">for</text>
    <text x="65" y="155" fill="#e6edf3" font-size="12"> (</text>
    <text x="75" y="155" fill="#ff7b72" font-size="12">const</text>
    <text x="115" y="155" fill="#e6edf3" font-size="12"> skill </text>
    <text x="165" y="155" fill="#ff7b72" font-size="12">of</text>
    <text x="185" y="155" fill="#e6edf3" font-size="12"> skills) {</text>
    <text x="50" y="175" fill="#79c0ff" font-size="12">console</text>
    <text x="95" y="175" fill="#e6edf3" font-size="12">.log(skill); </text>
    <text x="180" y="175" fill="#7ee787" font-size="12">// 'HTML', 'CSS', 'JS'</text>

    <text x="20" y="215" fill="#7ee787" font-size="12">✔ Поддерживает break, continue, return, await</text>
    <text x="20" y="235" fill="#7ee787" font-size="12">✔ Не проходит по кастомным свойствам массива</text>
    <text x="20" y="255" fill="#7ee787" font-size="12">✔ Высокая скорость выполнения в движке V8</text>
  </g>

  <!-- Column 2: for...in -->
  <g transform="translate(520, 95)" filter="url(#shadow)">
    <rect width="440" height="270" rx="8" fill="#0d1117" stroke="#ffb02e" stroke-width="2"/>
    <rect width="440" height="40" rx="8" fill="#161b22"/>
    <text x="20" y="26" fill="#ffb02e" font-size="16" font-weight="bold">for...in — По КЛЮЧАМ (свойствам)</text>
    <rect x="330" y="10" width="90" height="20" rx="4" fill="rgba(255,176,46,0.15)" stroke="#ffb02e" stroke-width="1"/>
    <text x="375" y="24" fill="#ffb02e" font-size="11" text-anchor="middle">Object Keys</text>

    <text x="20" y="65" fill="#e6edf3" font-size="13">• Перебирает ВСЕ перечисляемые ключи (enumerable)</text>
    <text x="20" y="88" fill="#ff7b72" font-size="12">  Включая свойства из цепочки прототипов (!)</text>
    
    <rect x="20" y="105" width="400" height="85" rx="6" fill="#03060a" stroke="#30363d"/>
    <text x="35" y="130" fill="#ff7b72" font-size="12">const</text>
    <text x="75" y="130" fill="#e6edf3" font-size="12">user = { </text>
    <text x="135" y="130" fill="#79c0ff" font-size="12">name</text>
    <text x="165" y="130" fill="#e6edf3" font-size="12">: </text>
    <text x="175" y="130" fill="#a5d6ff" font-size="12">'Алексей'</text>
    <text x="235" y="130" fill="#e6edf3" font-size="12">, </text>
    <text x="245" y="130" fill="#79c0ff" font-size="12">level</text>
    <text x="280" y="130" fill="#e6edf3" font-size="12">: </text>
    <text x="295" y="130" fill="#79c0ff" font-size="12">3</text>
    <text x="310" y="130" fill="#e6edf3" font-size="12"> };</text>
    <text x="35" y="155" fill="#ff7b72" font-size="12">for</text>
    <text x="65" y="155" fill="#e6edf3" font-size="12"> (</text>
    <text x="75" y="155" fill="#ff7b72" font-size="12">const</text>
    <text x="115" y="155" fill="#e6edf3" font-size="12"> key </text>
    <text x="150" y="155" fill="#ff7b72" font-size="12">in</text>
    <text x="170" y="155" fill="#e6edf3" font-size="12"> user) {</text>
    <text x="50" y="175" fill="#79c0ff" font-size="12">console</text>
    <text x="95" y="175" fill="#e6edf3" font-size="12">.log(key, user[key]); </text>
    <text x="240" y="175" fill="#ffb02e" font-size="12">// 'name', 'level'</text>

    <text x="20" y="215" fill="#ff7b72" font-size="12">✖ НЕ использовать для массивов (индексы — строки)</text>
    <text x="20" y="235" fill="#ffb02e" font-size="12">⚠ Требует hasOwnProperty() для фильтра прототипа</text>
    <text x="20" y="255" fill="#7ee787" font-size="12">✔ Лучшая альтернатива: Object.keys() / Object.entries()</text>
  </g>

  <!-- Bottom Panel: Guard Clauses vs Nested If -->
  <g transform="translate(40, 385)" filter="url(#shadow)">
    <rect width="920" height="150" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
    <rect width="920" height="35" rx="8" fill="#161b22"/>
    <text x="20" y="23" fill="#29e7ff" font-size="14" font-weight="bold">Архитектурный паттерн: Guard Clauses (Ранний возврат) вместо "Лестниц if-else"</text>

    <g transform="translate(20, 48)">
      <rect width="420" height="85" rx="4" fill="#1f1315" stroke="#f85149" stroke-width="1"/>
      <text x="15" y="20" fill="#f85149" font-size="12" font-weight="bold">❌ Антипаттерн (Глубокая вложенность):</text>
      <text x="15" y="42" fill="#8b949e" font-size="11">function process(user) {</text>
      <text x="15" y="58" fill="#8b949e" font-size="11">  if (user) { if (user.isActive) { if (user.hasAccess) { ... } } }</text>
      <text x="15" y="74" fill="#8b949e" font-size="11">}</text>
    </g>

    <g transform="translate(480, 48)">
      <rect width="420" height="85" rx="4" fill="#0d1f14" stroke="#2dff8a" stroke-width="1"/>
      <text x="15" y="20" fill="#2dff8a" font-size="12" font-weight="bold">✔ Чистый код (Guard Clauses):</text>
      <text x="15" y="42" fill="#7ee787" font-size="11">function process(user) {</text>
      <text x="15" y="58" fill="#7ee787" font-size="11">  if (!user || !user.isActive || !user.hasAccess) return null;</text>
      <text x="15" y="74" fill="#7ee787" font-size="11">  return doMainLogic(user); // Чистый плоский код</text>
      <text x="15" y="90" fill="#7ee787" font-size="11">}</text>
    </g>
  </g>
</svg>