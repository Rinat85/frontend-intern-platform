<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgj7" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgj7)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">JS: DOM Манипуляция и Оптимизация Рендеринга</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">querySelector, DocumentFragment, template, closest() и устранение Reflow/Repaint</text>

  <!-- Left: Modern DOM Query & Traversal -->
  <rect x="20" y="65" width="370" height="175" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Поиск и навигация по DOM</text>
  
  <rect x="35" y="96" width="340" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="112" fill="#29e7ff" font-size="9">document.querySelector('.card')</text>
  <text x="45" y="126" fill="#8b949e" font-size="7">Возвращает 1-й элемент или null (querySelectorAll = NodeList)</text>

  <rect x="35" y="142" width="340" height="42" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="45" y="158" fill="#2dff8a" font-size="9" font-weight="600">element.closest('.container')</text>
  <text x="45" y="172" fill="#e6edf3" font-size="8">Ищет ближайшего предка вверх по DOM (для делегирования!)</text>

  <rect x="35" y="190" width="340" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="206" fill="#ffb02e" font-size="9">classList.toggle('active', isOpened)</text>
  <text x="45" y="220" fill="#8b949e" font-size="7">add, remove, toggle, contains, replace — чистая работа с классами</text>

  <!-- Right: Fragment & Template -->
  <rect x="410" y="65" width="370" height="175" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="595" y="85" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">DocumentFragment &amp; &lt;template&gt;</text>
  
  <rect x="425" y="96" width="340" height="62" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="112" fill="#ffb02e" font-size="9" font-weight="600">DocumentFragment (Виртуальный контейнер)</text>
  <text x="435" y="126" fill="#e6edf3" font-size="8">Вставка 1000 элементов через fragment вызывает</text>
  <text x="435" y="140" fill="#2dff8a" font-size="8 font-weight=600">ровно ОДИН Reflow браузера вместо тысячи!</text>
  <text x="435" y="150" fill="#8b949e" font-size="7">const frag = document.createDocumentFragment();</text>

  <rect x="425" y="164" width="340" height="66" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="435" y="180" fill="#29e7ff" font-size="9" font-weight="600">&lt;template id="card-tpl"&gt;</text>
  <text x="435" y="194" fill="#e6edf3" font-size="8">Невидимый HTML-шаблон, клонируемый в JS:</text>
  <text x="435" y="208" fill="#8b949e" font-size="7">const clone = template.content.cloneNode(true);</text>
  <text x="435" y="220" fill="#8b949e" font-size="7">Безопасно, производительно, изолировано от стилей</text>

  <!-- Reflow vs Repaint vs Composite -->
  <rect x="20" y="250" width="760" height="95" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="400" y="270" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">3 Фазы рендеринга: Reflow (Layout) → Repaint (Paint) → Composite</text>
  
  <rect x="35" y="282" width="230" height="52" rx="4" fill="#161b22" stroke="#f85149"/>
  <text x="150" y="298" fill="#f85149" font-size="9" font-weight="600" text-anchor="middle">Reflow (Пересчет геометрии)</text>
  <text x="150" y="312" fill="#8b949e" font-size="7" text-anchor="middle">width, height, margin, padding, top</text>
  <text x="150" y="324" fill="#ff7b72" font-size="7" text-anchor="middle">Самый медленный! Тормозит CPU</text>

  <rect x="275" y="282" width="230" height="52" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="390" y="298" fill="#ffb02e" font-size="9" font-weight="600" text-anchor="middle">Repaint (Перерисовка пикселей)</text>
  <text x="390" y="312" fill="#8b949e" font-size="7" text-anchor="middle">color, background, visibility</text>
  <text x="390" y="324" fill="#8b949e" font-size="7" text-anchor="middle">Средняя нагрузка</text>

  <rect x="515" y="282" width="250" height="52" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="640" y="298" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">Composite (Слои на GPU)</text>
  <text x="640" y="312" fill="#2dff8a" font-size="7" text-anchor="middle">transform, opacity</text>
  <text x="640" y="324" fill="#2dff8a" font-size="7" text-anchor="middle">60/120 FPS! Не вызывает Reflow</text>

  <!-- Bottom: Anti-pattern -->
  <rect x="20" y="355" width="760" height="70" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="375" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">❌ Антипаттерн: container.innerHTML += '...' в цикле</text>
  <text x="400" y="392" fill="#e6edf3" font-size="8" text-anchor="middle">innerHTML += полностью уничтожает и заново парсит ВСЁ DOM-дерево на каждой итерации, сбрасывая состояние инпутов!</text>
  <text x="400" y="408" fill="#2dff8a" font-size="8" text-anchor="middle">✅ Используйте: DocumentFragment, createElement или insertAdjacentHTML</text>
</svg>