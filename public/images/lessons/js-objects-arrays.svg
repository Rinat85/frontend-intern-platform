<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgo5" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="400" fill="url(#bgo5)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">JS: Объекты и Массивы — модель памяти</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Примитивы хранят значение, объекты — ссылку на Heap</text>
  <rect x="20" y="65" width="240" height="148" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="140" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Примитивы (Stack)</text>
  <rect x="35" y="96" width="210" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="140" y="113" fill="#e6edf3" font-size="9" text-anchor="middle">let a = 42  // копия значения</text>
  <rect x="35" y="128" width="210" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="140" y="145" fill="#e6edf3" font-size="9" text-anchor="middle">let b = a   // b = 42 (копия!)</text>
  <rect x="35" y="160" width="210" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="140" y="177" fill="#e6edf3" font-size="9" text-anchor="middle">b = 99  // a всё ещё 42</text>
  <text x="140" y="205" fill="#2dff8a" font-size="8" text-anchor="middle">Каждая переменная — своя копия</text>
  <rect x="280" y="65" width="280" height="148" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="420" y="85" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Объекты (Heap — по ссылке!)</text>
  <rect x="295" y="96" width="250" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="420" y="113" fill="#e6edf3" font-size="9" text-anchor="middle">let obj1 = { name: "Иван" }</text>
  <rect x="295" y="128" width="250" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="420" y="145" fill="#f85149" font-size="9" text-anchor="middle">let obj2 = obj1 // та же ссылка!</text>
  <rect x="295" y="160" width="250" height="26" rx="4" fill="#0d1117" stroke="#30363d"/><text x="420" y="177" fill="#f85149" font-size="9" text-anchor="middle">obj2.name = "Пётр" // obj1 тоже!</text>
  <text x="420" y="205" fill="#f85149" font-size="8" text-anchor="middle">Обе переменные = один объект в памяти</text>
  <rect x="580" y="65" width="200" height="148" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="680" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Копирование</text>
  <rect x="592" y="98" width="175" height="24" rx="4" fill="#0d1117" stroke="#2dff8a"/><text x="680" y="114" fill="#2dff8a" font-size="9" text-anchor="middle">{ ...obj } (shallow)</text>
  <rect x="592" y="128" width="175" height="24" rx="4" fill="#0d1117" stroke="#2dff8a"/><text x="680" y="144" fill="#2dff8a" font-size="9" text-anchor="middle">[...arr] (shallow)</text>
  <rect x="592" y="158" width="175" height="24" rx="4" fill="#0d1117" stroke="#ffb02e"/><text x="680" y="174" fill="#ffb02e" font-size="9" text-anchor="middle">structuredClone (deep)</text>
  <text x="680" y="205" fill="#8b949e" font-size="7" text-anchor="middle">Deep нужен для вложенных объектов</text>
  <rect x="20" y="228" width="370" height="155" rx="8" fill="none" stroke="#29e7ff" stroke-width="1"/>
  <text x="205" y="250" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Ключевые методы Object</text>
  <rect x="35" y="260" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="117" y="276" fill="#e6edf3" font-size="9" text-anchor="middle">Object.keys(obj)</text>
  <rect x="210" y="260" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="292" y="276" fill="#e6edf3" font-size="9" text-anchor="middle">Object.values(obj)</text>
  <rect x="35" y="290" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="117" y="306" fill="#e6edf3" font-size="9" text-anchor="middle">Object.entries(obj)</text>
  <rect x="210" y="290" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="292" y="306" fill="#e6edf3" font-size="9" text-anchor="middle">Object.assign(t, s)</text>
  <rect x="35" y="320" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="117" y="336" fill="#e6edf3" font-size="9" text-anchor="middle">Object.freeze(obj)</text>
  <rect x="210" y="320" width="165" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="292" y="336" fill="#e6edf3" font-size="9" text-anchor="middle">hasOwnProperty(k)</text>
  <text x="205" y="368" fill="#8b949e" font-size="8" text-anchor="middle">entries() = массив пар [ключ, значение]</text>
  <rect x="410" y="228" width="370" height="155" rx="8" fill="none" stroke="#ffb02e" stroke-width="1"/>
  <text x="595" y="250" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Мутирующие vs Иммутабельные Array</text>
  <rect x="425" y="262" width="165" height="46" rx="4" fill="#0d1117" stroke="#f85149"/><text x="507" y="278" fill="#f85149" font-size="9" text-anchor="middle">Мутируют оригинал:</text><text x="507" y="296" fill="#e6edf3" font-size="8" text-anchor="middle">push pop splice sort reverse</text>
  <rect x="600" y="262" width="165" height="46" rx="4" fill="#0d1117" stroke="#2dff8a"/><text x="682" y="278" fill="#2dff8a" font-size="9" text-anchor="middle">НЕ мутируют (new):</text><text x="682" y="296" fill="#e6edf3" font-size="8" text-anchor="middle">map filter slice concat</text>
  <rect x="425" y="316" width="340" height="28" rx="4" fill="#0d1117" stroke="#29e7ff"/><text x="595" y="334" fill="#29e7ff" font-size="9" text-anchor="middle">ES2023: toSorted() toReversed() toSpliced()</text>
  <text x="595" y="368" fill="#8b949e" font-size="8" text-anchor="middle">В React/Redux = только иммутабельные операции</text>
</svg>