<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgj10" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgj10)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">JS: Контекст this, Call/Apply/Bind и Прототипы</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">4 Правила this, Стрелочные функции, Prototype Chain, Object.create() и ES6 class</text>

  <!-- Left: 4 Rules of this -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">4 Правила вычисления this</text>

  <rect x="35" y="98" width="340" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="114" fill="#f85149" font-size="8" font-weight="600">1. Default Binding (По умолчанию)</text>
  <text x="45" y="128" fill="#8b949e" font-size="7">fn(); → window (в браузере) или undefined (в 'use strict')</text>

  <rect x="35" y="152" width="340" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="168" fill="#ffb02e" font-size="8" font-weight="600">2. Implicit Binding (Неявная привязка)</text>
  <text x="45" y="182" fill="#8b949e" font-size="7">user.getName(); → this === user (объект перед точкой)</text>

  <rect x="35" y="206" width="340" height="54" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="45" y="222" fill="#2dff8a" font-size="8" font-weight="600">3. Explicit Binding (Явная привязка)</text>
  <text x="45" y="236" fill="#e6edf3" font-size="7">fn.call(ctx, 1, 2) | fn.apply(ctx, [1, 2])</text>
  <text x="45" y="250" fill="#2dff8a" font-size="7">fn.bind(ctx) → создает функцию с намертво привязанным this</text>

  <rect x="35" y="266" width="340" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="282" fill="#29e7ff" font-size="8" font-weight="600">4. new Binding (Конструктор)</text>
  <text x="45" y="296" fill="#8b949e" font-size="7">const u = new User(); → this === создаваемый объект</text>

  <!-- Right: Prototypes -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Цепочка прототипов (Prototype Chain)</text>

  <rect x="425" y="98" width="340" height="50" rx="4" fill="#161b22" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="9" font-weight="600">Экземпляр: user = { name: 'Alex' }</text>
  <text x="435" y="132" fill="#8b949e" font-size="7">user.__proto__ (ссылка на User.prototype) ↓</text>

  <rect x="425" y="154" width="340" height="50" rx="4" fill="#161b22" stroke="#29e7ff"/>
  <text x="435" y="172" fill="#29e7ff" font-size="9" font-weight="600">Прототип: User.prototype = { login() }</text>
  <text x="435" y="188" fill="#8b949e" font-size="7">User.prototype.__proto__ ↓</text>

  <rect x="425" y="210" width="340" height="50" rx="4" fill="#161b22" stroke="#ffb02e"/>
  <text x="435" y="228" fill="#ffb02e" font-size="9" font-weight="600">Корень: Object.prototype = { toString() }</text>
  <text x="435" y="244" fill="#8b949e" font-size="7">Object.prototype.__proto__ === null (Конец цепи!)</text>

  <rect x="425" y="266" width="340" height="48" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="435" y="282" fill="#ff2bd6" font-size="8" font-weight="600">Стрелочные функции: () =&gt; {}</text>
  <text x="435" y="296" fill="#8b949e" font-size="7">НЕТ своего this! Запоминают this из окружающего скоупа</text>

  <!-- Bottom: Methods -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Потеря контекста в колбэках и решение через стрелки</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">❌ setTimeout(user.getName, 100) — функция оторвана от объекта, this === window/undefined!</text>
  <text x="400" y="390" fill="#2dff8a" font-size="8" text-anchor="middle">✅ Решение 1: setTimeout(() =&gt; user.getName(), 100) (стрелочная обёртка)</text>
  <text x="400" y="405" fill="#29e7ff" font-size="8" text-anchor="middle">✅ Решение 2: setTimeout(user.getName.bind(user), 100) (жесткая привязка bind)</text>
</svg>