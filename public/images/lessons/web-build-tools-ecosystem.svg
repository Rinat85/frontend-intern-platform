<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgbt4" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgbt4)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Инструменты сборки и Экосистема</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Vite vs Webpack, esbuild, Rollup, Tree Shaking, npm vs pnpm, Monorepo (Turborepo)</text>

  <!-- Left: Bundlers Evolution -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Эволюция бандлеров: Webpack vs Vite</text>

  <!-- Webpack Box -->
  <rect x="35" y="100" width="160" height="135" rx="6" fill="#f8514911" stroke="#f85149"/>
  <text x="115" y="118" fill="#f85149" font-size="8" font-weight="600" text-anchor="middle">Webpack (Bundle-based)</text>
  <text x="45" y="138" fill="#8b949e" font-size="6">• Собирает весь проект в 1 бандл</text>
  <text x="45" y="152" fill="#8b949e" font-size="6">• Медленный Cold Start (30-60с)</text>
  <text x="45" y="166" fill="#8b949e" font-size="6">• HMR замедляется с ростом файлов</text>
  <text x="45" y="180" fill="#8b949e" font-size="6">• Сложный конфиг (500 строк)</text>
  <text x="115" y="214" fill="#f85149" font-size="7" font-weight="600" text-anchor="middle">Классика прошлых лет</text>

  <!-- Vite Box -->
  <rect x="210" y="100" width="165" height="135" rx="6" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="292" y="118" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">Vite (Native ESM + esbuild)</text>
  <text x="220" y="138" fill="#e6edf3" font-size="6">• Мгновенный старт (&lt;300мс)</text>
  <text x="220" y="152" fill="#e6edf3" font-size="6">• esbuild на Go для зависимостей</text>
  <text x="220" y="166" fill="#e6edf3" font-size="6">• Native ESM: отдает файл по запросу</text>
  <text x="220" y="180" fill="#e6edf3" font-size="6">• Rollup под капотом для prod-билда</text>
  <text x="292" y="214" fill="#2dff8a" font-size="7" font-weight="600" text-anchor="middle">Современный стандарт ⚡</text>

  <text x="205" y="260" fill="#29e7ff" font-size="8" font-weight="600" text-anchor="middle">Tree Shaking: вырезание неиспользуемого dead-code</text>
  <text x="205" y="278" fill="#8b949e" font-size="7" text-anchor="middle">Source Maps: привязка production-ошибок к исходному коду</text>

  <!-- Right: Package Managers & Monorepos -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Пакетные менеджеры и Монорепозитории</text>

  <rect x="425" y="98" width="340" height="60" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">pnpm: Экономия диска на Hard Links:</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">Хранит 1 копию пакета на всем компьютере!</text>
  <text x="435" y="146" fill="#8b949e" font-size="6">В 3 раза быстрее npm, защита от Phantom Dependencies</text>

  <rect x="425" y="166" width="340" height="60" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="184" fill="#29e7ff" font-size="8" font-weight="600">Semantic Versioning (SemVer):</text>
  <text x="435" y="200" fill="#e6edf3" font-size="7">MAJOR.MINOR.PATCH  (2.4.1)</text>
  <text x="435" y="214" fill="#8b949e" font-size="6">^2.4.1 = обновлять minor/patch  |  ~2.4.1 = только patch</text>

  <rect x="425" y="234" width="340" height="55" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="252" fill="#ffb02e" font-size="8" font-weight="600">Monorepo: Turborepo / Nx / Workspaces:</text>
  <text x="435" y="268" fill="#e6edf3" font-size="7">Единый репозиторий: apps/web, apps/admin, packages/ui</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Инженерная зрелость: владение инструментарием сборки</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Vite ускоряет DX (Developer Experience) за счет esbuild и отдачи нативных ES-модулей без сборки всего бандла</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• pnpm исключает фантомные зависимости и экономит десятки гигабайт памяти благодаря глобальному хранилищу</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Фиксация package-lock.json гарантирует одинаковые версии пакетов у всех разработчиков и на CI/CD сервере</text>
</svg>