<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgcrs3" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgcrs3)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Культура Code Review и Принципы SOLID</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Правила эффективного PR, SOLID во фронтенде, DRY, KISS, YAGNI и Guard Clauses</text>

  <!-- Left: Code Review Culture -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Культура Code Review (Pull Request)</text>

  <rect x="35" y="100" width="340" height="46" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="45" y="116" fill="#2dff8a" font-size="8" font-weight="600">1. Атомарный размер PR (150–300 строк):</text>
  <text x="45" y="130" fill="#e6edf3" font-size="7">Легко ревьюить за 10 минут, 0 усталости рецензента</text>

  <rect x="35" y="152" width="340" height="46" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="45" y="168" fill="#29e7ff" font-size="8" font-weight="600">2. Префиксы комментариев:</text>
  <text x="45" y="182" fill="#e6edf3" font-size="7">[nitpick] — вкусовщина  |  [blocker] — баг/уязвимость</text>

  <rect x="35" y="204" width="340" height="46" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="45" y="220" fill="#ffb02e" font-size="8" font-weight="600">3. Обязательный Self-Review:</text>
  <text x="45" y="234" fill="#e6edf3" font-size="7">Автор сам проверяет diff перед запросом ревью</text>

  <rect x="35" y="256" width="340" height="46" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="45" y="272" fill="#d2a8ff" font-size="8" font-weight="600">4. Конструктивная эмпатия:</text>
  <text x="45" y="286" fill="#8b949e" font-size="7">Критикуйте код, а не автора. Объясняйте причину замечания</text>

  <!-- Right: SOLID in Frontend -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">SOLID &amp; Чистый код во фронтенде</text>

  <rect x="425" y="98" width="340" height="40" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="114" fill="#2dff8a" font-size="8" font-weight="600">S — Single Responsibility:</text>
  <text x="435" y="128" fill="#8b949e" font-size="7">Компонент рендерит UI, хук держит стейт, API шлет запрос</text>

  <rect x="425" y="142" width="340" height="40" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="158" fill="#29e7ff" font-size="8" font-weight="600">O — Open/Closed:</text>
  <text x="435" y="172" fill="#8b949e" font-size="7">Расширение через props/children без переписывания исходника</text>

  <rect x="425" y="186" width="340" height="40" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="202" fill="#ffb02e" font-size="8" font-weight="600">I — Interface Segregation:</text>
  <text x="435" y="216" fill="#8b949e" font-size="7">Передаем только нужные поля (avatarUrl, name), а не весь User</text>

  <rect x="425" y="230" width="340" height="40" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="435" y="246" fill="#ff2bd6" font-size="8" font-weight="600">D — Dependency Inversion:</text>
  <text x="435" y="260" fill="#8b949e" font-size="7">Инверсия зависимостей через React Context и пропсы</text>

  <rect x="425" y="274" width="340" height="40" rx="4" fill="#0d1117" stroke="#d2a8ff"/>
  <text x="435" y="290" fill="#d2a8ff" font-size="8" font-weight="600">Guard Clauses: устранение пирамид if/else</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Главный принцип чистого кода</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Любой дурак может написать код, понятный компьютеру. Хорошие программисты пишут код, понятный людям (Мартин Фаулер)</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Принципы KISS и YAGNI защищают от оверинжиниринга: делайте код простым и не пишите логику «на будущее»</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Маленькие Pull Request'ы — признак зрелого сеньор-разработчика</text>
</svg>