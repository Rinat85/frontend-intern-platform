<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgpf12" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgpf12)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Архитектура Feature-Sliced Design (FSD 2.0)</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">6 Слоев FSD, Правило однонаправленных зависимостей, Public API (index.ts) и Слайсы</text>

  <!-- Layers Pyramid -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Иерархия слоев FSD (Импорты только СВЕРХУ ВНИЗ!)</text>

  <!-- 1. app -->
  <rect x="40" y="96" width="420" height="30" rx="4" fill="#f8514922" stroke="#f85149"/>
  <text x="50" y="116" fill="#f85149" font-size="8" font-weight="600">app/</text>
  <text x="120" y="116" fill="#e6edf3" font-size="7">Инициализация, провайдеры (Redux/React Query), роутер, глобальные стили</text>

  <!-- 2. pages -->
  <rect x="40" y="132" width="420" height="30" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="50" y="152" fill="#ffb02e" font-size="8" font-weight="600">pages/</text>
  <text x="120" y="152" fill="#e6edf3" font-size="7">Экраны приложения (Home, ProfilePage, LessonPage) — композиция виджетов</text>

  <!-- 3. widgets -->
  <rect x="40" y="168" width="420" height="30" rx="4" fill="#ff2bd622" stroke="#ff2bd6"/>
  <text x="50" y="188" fill="#ff2bd6" font-size="8" font-weight="600">widgets/</text>
  <text x="120" y="188" fill="#e6edf3" font-size="7">Крупные самостоятельные блоки UI (Header, Sidebar, UserStatsWidget)</text>

  <!-- 4. features -->
  <rect x="40" y="204" width="420" height="30" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="50" y="224" fill="#29e7ff" font-size="8" font-weight="600">features/</text>
  <text x="120" y="224" fill="#e6edf3" font-size="7">Действия пользователя с бизнес-ценностью (AuthByEmail, FilterCourses, SubmitTask)</text>

  <!-- 5. entities -->
  <rect x="40" y="240" width="420" height="30" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="50" y="260" fill="#2dff8a" font-size="8" font-weight="600">entities/</text>
  <text x="120" y="260" fill="#e6edf3" font-size="7">Бизнес-сущности реального мира (User, Lesson, Course, Certificate)</text>

  <!-- 6. shared -->
  <rect x="40" y="276" width="420" height="30" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="50" y="296" fill="#d2a8ff" font-size="8" font-weight="600">shared/</text>
  <text x="120" y="296" fill="#e6edf3" font-size="7">UI-kit (Button, Input), API client (axios/fetch), хелперы, типы (БЕЗ бизнес-логики!)</text>

  <!-- Right: FSD Golden Rules -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="640" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">3 Закона FSD</text>

  <rect x="515" y="98" width="250" height="60" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="525" y="116" fill="#2dff8a" font-size="8" font-weight="600">1. Зависимости только вниз:</text>
  <text x="525" y="132" fill="#e6edf3" font-size="7">widgets → features → entities → shared</text>
  <text x="525" y="146" fill="#f85149" font-size="6">❌ entity НЕ может импортировать feature!</text>

  <rect x="515" y="166" width="250" height="68" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="525" y="184" fill="#29e7ff" font-size="8" font-weight="600">2. Public API (index.ts):</text>
  <text x="525" y="200" fill="#e6edf3" font-size="7">import { UserCard } from '@/entities/user'</text>
  <text x="525" y="214" fill="#8b949e" font-size="6">Запрещены глубокие импорты вглубь слайса</text>

  <rect x="515" y="242" width="250" height="68" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="525" y="260" fill="#ffb02e" font-size="8" font-weight="600">3. Сегменты слайса:</text>
  <text x="525" y="276" fill="#e6edf3" font-size="7">ui/ (компоненты), model/ (стейт),</text>
  <text x="525" y="290" fill="#e6edf3" font-size="7">api/ (запросы), lib/ (утилиты)</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Преимущества FSD: масштабирование без боли</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Любой новый стажёр за 5 минут находит, где лежит кнопка, модель данных или запрос к API</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Полное отсутствие циклических зависимостей (Circular Dependencies) благодаря строгой иерархии</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Архитектура проверяется автоматически линтером eslint-plugin-boundaries в CI конвейере</text>
</svg>