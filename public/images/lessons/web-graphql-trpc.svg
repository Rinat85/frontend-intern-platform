<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bggql19" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bggql19)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: GraphQL, Apollo Client, tRPC и gRPC-web</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">REST vs GraphQL, Normalized Cache, Optimistic UI, End-to-End Type Safety в tRPC</text>

  <!-- Left: REST vs GraphQL -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">REST против GraphQL</text>

  <rect x="35" y="100" width="340" height="60" rx="4" fill="#f8514911" stroke="#f85149"/>
  <text x="45" y="118" fill="#f85149" font-size="8" font-weight="600">Проблемы REST API:</text>
  <text x="45" y="132" fill="#e6edf3" font-size="7">• Over-fetching: лишние 50 полей объекта в ответе</text>
  <text x="45" y="146" fill="#8b949e" font-size="6">• Under-fetching / N+1: 5 последовательных запросов (/user, /posts, /comments)</text>

  <rect x="35" y="168" width="340" height="65" rx="4" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="45" y="186" fill="#2dff8a" font-size="8" font-weight="600">Преимущества GraphQL (SDL &amp; Single Endpoint):</text>
  <text x="45" y="200" fill="#e6edf3" font-size="7">• Клиент запрашивает ТОЛЬКО нужные поля (0 лишних байт!)</text>
  <text x="45" y="214" fill="#8b949e" font-size="6">• Получение связанных данных в 1 HTTP POST запросе (/graphql)</text>
  <text x="45" y="226" fill="#29e7ff" font-size="6">• Строгая типизация схемы Schema Definition Language (SDL)</text>

  <rect x="35" y="240" width="340" height="68" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="45" y="258" fill="#ffb02e" font-size="8" font-weight="600">3 Операции: Query, Mutation, Subscription:</text>
  <text x="45" y="272" fill="#e6edf3" font-size="7">• Query — чтение (аналог GET)</text>
  <text x="45" y="284" fill="#e6edf3" font-size="7">• Mutation — изменение данных (POST/PUT/DELETE)</text>
  <text x="45" y="296" fill="#8b949e" font-size="6">• Subscription — реалтайм поток через WebSocket</text>

  <!-- Right: Apollo Cache & tRPC -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Apollo Cache и Революция tRPC</text>

  <rect x="425" y="98" width="340" height="70" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">Normalized Cache (Apollo InMemoryCache):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">Нормализует объекты по ключу: __typename:id (User:42)</text>
  <text x="435" y="146" fill="#8b949e" font-size="6">Обновление поля в одном месте автоматически обновляет ВСЕ компоненты UI!</text>
  <text x="435" y="158" fill="#29e7ff" font-size="6">Optimistic UI: мгновенный отклик интерфейса до ответа сервера</text>

  <rect x="425" y="176" width="340" height="68" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="194" fill="#29e7ff" font-size="8" font-weight="600">tRPC — End-to-End Type Safety ⚡:</text>
  <text x="435" y="210" fill="#e6edf3" font-size="7">Единый TypeScript-контракт между Backend и Frontend</text>
  <text x="435" y="224" fill="#8b949e" font-size="6">0 кодогенерации, автокомплит эндпоинтов и типов прямо в IDE!</text>
  <text x="435" y="234" fill="#8b949e" font-size="6">trpc.user.getById.useQuery({ id: 123 })</text>

  <rect x="425" y="252" width="340" height="55" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="268" fill="#ffb02e" font-size="8" font-weight="600">gRPC-web &amp; Protocol Buffers:</text>
  <text x="435" y="282" fill="#e6edf3" font-size="7">Бинарный протокол Protobuf поверх HTTP/2</text>
  <text x="435" y="294" fill="#8b949e" font-size="6">В 5-10 раз меньше и быстрее JSON для Highload систем</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Как выбирать протокол взаимодействия</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Full-stack TypeScript (Next.js/Node): выбирайте tRPC — абсолютная безопасность типов без оверхеда</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Крупный Enterprise с мобильными клиентами (iOS/Android/Web): GraphQL с Apollo Client</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Простые CRUD-сервисы с кешированием на CDN: классический REST API</text>
</svg>