<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgdp7" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgdp7)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Паттерны проектирования в JavaScript и React</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Singleton, Factory, Observer/PubSub, Proxy (Реактивность), Strategy, Compound Components</text>

  <!-- Left: GoF Patterns in JS -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Классические паттерны в Frontend</text>

  <rect x="35" y="98" width="340" height="48" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="45" y="114" fill="#2dff8a" font-size="8" font-weight="600">1. Singleton (Одиночка):</text>
  <text x="45" y="128" fill="#e6edf3" font-size="7">Единый экземпляр: apiClient, WebSocketService, Logger</text>
  <text x="45" y="138" fill="#8b949e" font-size="6">В ES-модулях любой export const instance = new Client() — это нативный Singleton!</text>

  <rect x="35" y="152" width="340" height="48" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="45" y="168" fill="#29e7ff" font-size="8" font-weight="600">2. Observer / PubSub (Издатель-Подписчик):</text>
  <text x="45" y="182" fill="#e6edf3" font-size="7">Связь слабой зацепленности (Event Emitter, Custom Events)</text>
  <text x="45" y="192" fill="#8b949e" font-size="6">Основа всех стейт-менеджеров (Redux, Zustand, EventEmitter)</text>

  <rect x="35" y="206" width="340" height="50" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="45" y="222" fill="#ffb02e" font-size="8" font-weight="600">3. Proxy (Перехватчик / Реактивность):</text>
  <text x="45" y="236" fill="#e6edf3" font-size="7">Перехват get/set для авто-рендеринга и валидации</text>
  <text x="45" y="248" fill="#8b949e" font-size="6">Основа реактивности Vue 3, MobX и Zustand</text>

  <rect x="35" y="262" width="340" height="45" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="45" y="278" fill="#d2a8ff" font-size="8" font-weight="600">4. Strategy (Стратегия):</text>
  <text x="45" y="294" fill="#8b949e" font-size="6">Сменные алгоритмы: оплата картой/СБП/криптой, валидация полей</text>

  <!-- Right: Component Patterns -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Паттерны архитектуры компонентов</text>

  <rect x="425" y="98" width="340" height="65" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">Compound Components (Составные компоненты):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">&lt;Select&gt;&lt;Select.Option /&gt;&lt;/Select&gt;</text>
  <text x="435" y="146" fill="#8b949e" font-size="6">Компоненты делят скрытый контекст (Select, Accordion, Modal)</text>

  <rect x="425" y="170" width="340" height="65" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="188" fill="#29e7ff" font-size="8" font-weight="600">Custom Hooks (Выделение логики):</text>
  <text x="435" y="204" fill="#e6edf3" font-size="7">useDebounce, useLocalStorage, useMediaQuery</text>
  <text x="435" y="218" fill="#8b949e" font-size="6">Изоляция бизнес-логики и сайд-эффектов от верстки UI</text>

  <rect x="425" y="242" width="340" height="65" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="260" fill="#ffb02e" font-size="8" font-weight="600">Higher-Order Components (HOC) &amp; Render Props:</text>
  <text x="435" y="276" fill="#e6edf3" font-size="7">withAuth(Component), VirtualList renderItem={...}</text>
  <text x="435" y="290" fill="#8b949e" font-size="6">Оборачивание прав доступа, виртуализация списков</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Зачем нужны паттерны проектирования</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Паттерны — это проверенные временем решения типичных архитектурных задач в разработке ПО</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• PubSub обеспечивает слабую связанность (Loose Coupling), делая модули независимыми друг от друга</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Compound Components делают UI-компоненты невероятно гибкими и удобными в использовании</text>
</svg>