<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgmfe16" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgmfe16)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Архитектура Микрофронтендов и Module Federation</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Монолит vs Микрофронтенды, Host &amp; Remote контейнеры, Shared Singleton Dependencies, Error Isolation</text>

  <!-- Left: Monolith vs Microfrontends -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Фронтенд Монолит vs Микрофронтенды</text>

  <rect x="35" y="100" width="160" height="135" rx="6" fill="#f8514911" stroke="#f85149"/>
  <text x="115" y="118" fill="#f85149" font-size="8" font-weight="600" text-anchor="middle">Монолит (1 Репозиторий)</text>
  <text x="45" y="138" fill="#8b949e" font-size="6">• 50+ разработчиков в 1 Git</text>
  <text x="45" y="152" fill="#8b949e" font-size="6">• Конфликты мержа в main</text>
  <text x="45" y="166" fill="#8b949e" font-size="6">• CI/CD билд идет 45 минут</text>
  <text x="45" y="180" fill="#8b949e" font-size="6">• Баг в корзине роняет ВСЁ</text>
  <text x="115" y="214" fill="#f85149" font-size="7" font-weight="600" text-anchor="middle">Трудно масштабировать</text>

  <rect x="210" y="100" width="165" height="135" rx="6" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="292" y="118" fill="#2dff8a" font-size="8" font-weight="600" text-anchor="middle">Микрофронтенды (MFE)</text>
  <text x="220" y="138" fill="#e6edf3" font-size="6">• Команды деплоят независимо</text>
  <text x="220" y="152" fill="#e6edf3" font-size="6">• Автономные репозитории</text>
  <text x="220" y="166" fill="#e6edf3" font-size="6">• Билд модуля за 1 минуту</text>
  <text x="220" y="180" fill="#e6edf3" font-size="6">• Изоляция сбоев (Error Boundary)</text>
  <text x="292" y="214" fill="#2dff8a" font-size="7" font-weight="600" text-anchor="middle">Enterprise Стандарт ⚡</text>

  <text x="205" y="260" fill="#29e7ff" font-size="8" font-weight="600" text-anchor="middle">4 Подхода: iFrames | Web Components | Build-time | Module Federation</text>
  <text x="205" y="278" fill="#8b949e" font-size="7" text-anchor="middle">Module Federation — единственный стандарт с динамическим шарингом библиотек</text>

  <!-- Right: Module Federation Architecture -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Архитектура Module Federation (Webpack/Vite)</text>

  <!-- Host Container -->
  <rect x="425" y="98" width="340" height="52" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="435" y="114" fill="#2dff8a" font-size="8" font-weight="600">HOST Container (App Shell / Оболочка):</text>
  <text x="435" y="128" fill="#e6edf3" font-size="7">Маршрутизация, общая авторизация, монтирование Remote-модулей</text>
  <text x="435" y="138" fill="#8b949e" font-size="6">remotes: { catalog: 'catalog@https://cdn.com/remoteEntry.js' }</text>

  <!-- Remote 1 -->
  <rect x="425" y="156" width="165" height="60" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="507" y="174" fill="#29e7ff" font-size="8" font-weight="600" text-anchor="middle">Remote: Catalog MFE</text>
  <text x="507" y="188" fill="#e6edf3" font-size="6" text-anchor="middle">exposes: { './ProductList' }</text>
  <text x="507" y="200" fill="#8b949e" font-size="6" text-anchor="middle">Команда Каталога</text>

  <!-- Remote 2 -->
  <rect x="600" y="156" width="165" height="60" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="682" y="174" fill="#ffb02e" font-size="8" font-weight="600" text-anchor="middle">Remote: Checkout MFE</text>
  <text x="682" y="188" fill="#e6edf3" font-size="6" text-anchor="middle">exposes: { './CartWidget' }</text>
  <text x="682" y="200" fill="#8b949e" font-size="6" text-anchor="middle">Команда Оплаты</text>

  <!-- Shared Dependencies -->
  <rect x="425" y="224" width="340" height="65" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="435" y="242" fill="#2dff8a" font-size="8" font-weight="600">Shared Dependencies (Singleton React):</text>
  <text x="435" y="258" fill="#e6edf3" font-size="7">shared: { react: { singleton: true, requiredVersion: '^18.0.0' } }</text>
  <text x="435" y="272" fill="#8b949e" font-size="6">Предотвращает двойную загрузку React и дублирование состояния в памяти</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Когда переходить на микрофронтенды</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Не используйте MFE в небольших проектах — это распределенная система с оверхедом на инфраструктуру</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• MFE незаменимы, когда 5+ автономных команд разработчиков должны деплоить свои фичи по 10 раз в день</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Error Boundary на уровне Host Shell гарантирует, что сбой в одном виджете не сломает весь сервис</text>
</svg>