<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgnp6" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgnp6)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Сетевой стек, Протоколы и Кэширование</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">TCP 3-way handshake, TLS 1.3, HTTP/2 Мультиплексирование, HTTP/3 (QUIC/UDP) и ETag</text>

  <!-- Left: Protocols Evolution -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Сравнение протоколов передачи</text>

  <rect x="35" y="100" width="340" height="55" rx="4" fill="#f8514911" stroke="#f85149"/>
  <text x="45" y="118" fill="#f85149" font-size="8" font-weight="600">HTTP/1.1 (Текстовый, 1997):</text>
  <text x="45" y="132" fill="#8b949e" font-size="7">1 запрос за раз на TCP-соединение (Head-of-Line Blocking)</text>
  <text x="45" y="144" fill="#8b949e" font-size="6">Лимит ~6 одновременных TCP-соединений на домен</text>

  <rect x="35" y="162" width="340" height="55" rx="4" fill="#29e7ff11" stroke="#29e7ff"/>
  <text x="45" y="180" fill="#29e7ff" font-size="8" font-weight="600">HTTP/2 (Бинарный, 2015):</text>
  <text x="45" y="194" fill="#e6edf3" font-size="7">Мультиплексирование сотен запросов по 1 TCP-соединению!</text>
  <text x="45" y="206" fill="#8b949e" font-size="6">Сжатие заголовков HPACK (экономит до 80% трафика)</text>

  <rect x="35" y="224" width="340" height="65" rx="4" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="45" y="242" fill="#2dff8a" font-size="8" font-weight="600">HTTP/3 (QUIC поверх UDP, 2022):</text>
  <text x="45" y="256" fill="#e6edf3" font-size="7">Работает поверх UDP: потеря 1 пакета не тормозит остальные потоки!</text>
  <text x="45" y="270" fill="#2dff8a" font-size="6">0-RTT мгновенное повторное подключение, встроенный TLS 1.3 ⚡</text>

  <!-- Right: HTTP Caching & ETag -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Стратегии HTTP-кэширования</text>

  <rect x="425" y="98" width="340" height="65" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">1. Хешированные ассеты (JS / CSS):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">Cache-Control: public, max-age=31536000, immutable</text>
  <text x="435" y="146" fill="#8b949e" font-size="6">Кэшируются на 1 год без единого сетевого запроса!</text>

  <rect x="425" y="170" width="340" height="65" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="188" fill="#29e7ff" font-size="8" font-weight="600">2. index.html и API-ответы:</text>
  <text x="435" y="204" fill="#e6edf3" font-size="7">Cache-Control: no-cache  +  ETag</text>
  <text x="435" y="218" fill="#8b949e" font-size="6">Проверяется на сервере: если не изменился → 304 Not Modified (0 байт!)</text>

  <rect x="425" y="242" width="340" height="60" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="260" fill="#ffb02e" font-size="8" font-weight="600">3. Паттерн stale-while-revalidate:</text>
  <text x="435" y="276" fill="#e6edf3" font-size="7">Отдает старый кэш мгновенно, обновляя его в фоне</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Сетевая оптимизация: правила победы над задержками</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• HTTP/2 и HTTP/3 устранили необходимость конкатенации всех файлов в один гигантский бандл</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• ETag и статус 304 Not Modified экономят до 90% серверного трафика при повторных визитах</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Никогда не кэшируйте index.html намертво — он обязан проверяться через no-cache для доставки новых релизов</text>
</svg>