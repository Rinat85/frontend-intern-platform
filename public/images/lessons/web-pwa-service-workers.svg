<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgpwa17" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgpwa17)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: PWA, Service Workers и Offline-First</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Web App Manifest, Service Worker Lifecycle, 5 Стратегий кэширования и Background Sync</text>

  <!-- Left: Service Worker Lifecycle -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">Жизненный цикл Service Worker</text>

  <rect x="35" y="98" width="340" height="48" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="45" y="114" fill="#2dff8a" font-size="8" font-weight="600">1. install (Установка):</text>
  <text x="45" y="128" fill="#e6edf3" font-size="7">Кэширует статическую оболочку (App Shell: HTML, CSS, JS)</text>
  <text x="45" y="138" fill="#8b949e" font-size="6">self.skipWaiting() — немедленный переход к активации</text>

  <rect x="35" y="152" width="340" height="48" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="45" y="168" fill="#29e7ff" font-size="8" font-weight="600">2. activate (Активация):</text>
  <text x="45" y="182" fill="#e6edf3" font-size="7">Удаляет старые версии кэша (caches.delete(oldCache))</text>
  <text x="45" y="192" fill="#8b949e" font-size="6">self.clients.claim() — берет под контроль открытые вкладки</text>

  <rect x="35" y="206" width="340" height="50" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="45" y="222" fill="#ffb02e" font-size="8" font-weight="600">3. fetch (Перехват сетевых запросов):</text>
  <text x="45" y="236" fill="#e6edf3" font-size="7">Программируемый прокси между браузером и интернетом</text>
  <text x="45" y="248" fill="#8b949e" font-size="6">event.respondWith(caches.match(request))</text>

  <rect x="35" y="262" width="340" height="45" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="45" y="278" fill="#d2a8ff" font-size="8" font-weight="600">4. Web App Manifest (manifest.json):</text>
  <text x="45" y="292" fill="#8b949e" font-size="6">standalone дисплей, иконки, theme_color, установка на рабочий стол</text>

  <!-- Right: 5 Caching Strategies -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">5 Стратегий кэширования (Workbox)</text>

  <rect x="425" y="98" width="340" height="48" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="114" fill="#2dff8a" font-size="8" font-weight="600">1. Cache-First (Шрифты, Изображения, CSS/JS):</text>
  <text x="435" y="128" fill="#e6edf3" font-size="7">Кэш → если нет → Сеть → Сохранить в кэш</text>
  <text x="435" y="138" fill="#8b949e" font-size="6">Мгновенный 0мс отклик для неизменяемых ассетов</text>

  <rect x="425" y="152" width="340" height="48" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="168" fill="#29e7ff" font-size="8" font-weight="600">2. Network-First (Профиль, Баланс счета):</text>
  <text x="435" y="182" fill="#e6edf3" font-size="7">Сеть → если сбой (Offline) → Отдать запасной кэш</text>
  <text x="435" y="192" fill="#8b949e" font-size="6">Всегда свежие данные, но работает в метро без связи</text>

  <rect x="425" y="206" width="340" height="48" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="222" fill="#ffb02e" font-size="8" font-weight="600">3. Stale-While-Revalidate (Ленты, Статьи):</text>
  <text x="435" y="236" fill="#e6edf3" font-size="7">Мгновенно отдать старый кэш + обновить в фоне</text>
  <text x="435" y="246" fill="#8b949e" font-size="6">Лучший баланс скорости и актуальности контента</text>

  <rect x="425" y="260" width="340" height="48" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="435" y="276" fill="#ff2bd6" font-size="8" font-weight="600">4. Background Sync API (Оффлайн-очередь):</text>
  <text x="435" y="290" fill="#8b949e" font-size="6">Сохраняет отправку формы в IndexedDB и шлет при появлении сети</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Почему PWA трансформирует веб-приложения</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• PWA работает 100% автономно при отсутствии интернета благодаря Service Worker и Cache API</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Установка в 1 клик минуя App Store и Google Play с полной поддержкой Push Notifications</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Повторные визиты открываются за 50 мс прямо из локального кэша App Shell</text>
</svg>