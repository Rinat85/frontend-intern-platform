<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgpr11" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgpr11)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Реалтайм-Коммуникация (Realtime Web)</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Polling vs Server-Sent Events (SSE) vs WebSockets (wss://), Heartbeat и Reconnection</text>

  <!-- 3 Protocol Comparison -->
  <rect x="20" y="65" width="240" height="260" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="140" y="85" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">1. Polling (Опрос)</text>
  <rect x="30" y="98" width="220" height="215" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="116" fill="#f85149" font-size="8" font-weight="600">Short / Long Polling</text>
  <text x="40" y="132" fill="#e6edf3" font-size="7">• Клиент шлет GET каждые N сек</text>
  <text x="40" y="148" fill="#8b949e" font-size="7">• Тяжелые HTTP-заголовки (1 КБ+)</text>
  <text x="40" y="164" fill="#8b949e" font-size="7">• Нагрузка на сервер и БД</text>
  <text x="40" y="180" fill="#8b949e" font-size="7">• Задержка доставки данных</text>
  <text x="40" y="205" fill="#ffb02e" font-size="7" font-weight="600">Где применяется:</text>
  <text x="40" y="220" fill="#8b949e" font-size="6">Устаревший fallback для старых браузеров</text>

  <rect x="280" y="65" width="240" height="260" rx="8" fill="#0d1117" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="400" y="85" fill="#ffb02e" font-size="11" font-weight="600" text-anchor="middle">2. SSE (EventSource)</text>
  <rect x="290" y="98" width="220" height="215" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="300" y="116" fill="#ffb02e" font-size="8" font-weight="600">Server-Sent Events</text>
  <text x="300" y="132" fill="#e6edf3" font-size="7">• Однонаправленный Push поток</text>
  <text x="300" y="148" fill="#2dff8a" font-size="7">• Работает поверх HTTP/2</text>
  <text x="300" y="164" fill="#2dff8a" font-size="7">• Авто-реконнект из коробки!</text>
  <text x="300" y="180" fill="#2dff8a" font-size="7">• Простой API: new EventSource()</text>
  <text x="300" y="205" fill="#2dff8a" font-size="7" font-weight="600">Идеально для:</text>
  <text x="300" y="220" fill="#e6edf3" font-size="6">AI-стриминг (LLM ChatGPT), котировки, уведомления</text>

  <rect x="540" y="65" width="240" height="260" rx="8" fill="#0d1117" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="660" y="85" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">3. WebSockets (wss://)</text>
  <rect x="550" y="98" width="220" height="215" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="560" y="116" fill="#2dff8a" font-size="8" font-weight="600">Full-Duplex (Двусторонний)</text>
  <text x="560" y="132" fill="#e6edf3" font-size="7">• Полнодуплексный TCP сокет</text>
  <text x="560" y="148" fill="#2dff8a" font-size="7">• Минимальный оверхед (2 байта!)</text>
  <text x="560" y="164" fill="#2dff8a" font-size="7">• Мгновенный обмен в обе стороны</text>
  <text x="560" y="180" fill="#29e7ff" font-size="7">• Бинарные данные (ArrayBuffer)</text>
  <text x="560" y="205" fill="#2dff8a" font-size="7" font-weight="600">Идеально для:</text>
  <text x="560" y="220" fill="#e6edf3" font-size="6">Чаты, мультиплеер игры, совместное редактирование</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Production-паттерны WebSockets</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Heartbeat (Ping/Pong) — периодическая проверка активности соединения каждые 30 секунд для защиты от разрыва NAT</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Exponential Backoff Reconnection — умное переподключение с растущей задержкой (1с → 2с → 4с → 8с) при сбое сети</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Для стриминга ответов нейросетей (AI Markdown streaming) стандарт де-факто — Server-Sent Events (SSE)</text>
</svg>