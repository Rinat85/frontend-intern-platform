<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgsec19" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgsec19)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Безопасность фронтенда (AppSec &amp; Web Security)</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">XSS Защита (DOMPurify), CSRF Tokens, SameSite Cookies, CSP Headers, CORS &amp; HttpOnly JWT</text>

  <!-- Left: XSS & CSRF -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">XSS и CSRF: Векторы атак и Защита</text>

  <rect x="35" y="100" width="340" height="65" rx="4" fill="#f8514922" stroke="#f85149"/>
  <text x="45" y="118" fill="#f85149" font-size="8" font-weight="600">1. XSS (Cross-Site Scripting) — Внедрение скриптов:</text>
  <text x="45" y="132" fill="#e6edf3" font-size="7">Злоумышленник внедряет вредоносный JS: кража токенов, сессий</text>
  <text x="45" y="146" fill="#8b949e" font-size="6">❌ Опасно: innerHTML, eval(), dangerouslySetInnerHTML</text>
  <text x="45" y="158" fill="#2dff8a" font-size="6">✅ Защита: textContent, DOMPurify.sanitize(userInput)</text>

  <rect x="35" y="172" width="340" height="65" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="45" y="190" fill="#ffb02e" font-size="8" font-weight="600">2. CSRF (Cross-Site Request Forgery) — Подделка запросов:</text>
  <text x="45" y="204" fill="#e6edf3" font-size="7">Чужой сайт заставляет браузер отправить куки на банк: POST /transfer</text>
  <text x="45" y="218" fill="#2dff8a" font-size="6">✅ Защита: Set-Cookie: SameSite=Strict; Secure; HttpOnly</text>
  <text x="45" y="230" fill="#29e7ff" font-size="6">✅ Защита: Анти-CSRF токен в заголовке X-CSRF-Token</text>

  <rect x="35" y="244" width="340" height="65" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="45" y="260" fill="#2dff8a" font-size="8" font-weight="600">3. Безопасное хранение JWT Токенов:</text>
  <text x="45" y="274" fill="#f85149" font-size="7">❌ localStorage: доступен любому XSS-скрипту (кража токена за 1мс!)</text>
  <text x="45" y="288" fill="#2dff8a" font-size="7">✅ HttpOnly Cookie: JS не имеет доступа к токену даже при наличии XSS!</text>

  <!-- Right: CSP & CORS -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">CSP Заголовки и CORS Политика</text>

  <rect x="425" y="98" width="340" height="85" rx="4" fill="#2dff8a11" stroke="#2dff8a"/>
  <text x="435" y="116" fill="#2dff8a" font-size="8" font-weight="600">Content Security Policy (CSP):</text>
  <text x="435" y="132" fill="#e6edf3" font-size="7">Content-Security-Policy: default-src 'self';</text>
  <text x="435" y="146" fill="#e6edf3" font-size="7">  script-src 'self' https://api.sentry.io 'nonce-rAnd0m';</text>
  <text x="435" y="160" fill="#e6edf3" font-size="7">  object-src 'none'; frame-ancestors 'none';</text>
  <text x="435" y="174" fill="#8b949e" font-size="6">Блокирует выполнение инжектированных инлайн-скриптов и фреймов!</text>

  <rect x="425" y="190" width="340" height="60" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="206" fill="#29e7ff" font-size="8" font-weight="600">CORS (Cross-Origin Resource Sharing):</text>
  <text x="435" y="220" fill="#e6edf3" font-size="7">Браузерная защита от несанкционированных кросс-доменных API</text>
  <text x="435" y="234" fill="#8b949e" font-size="6">Access-Control-Allow-Origin: https://app.example.com (никогда * с куками)</text>

  <rect x="425" y="258" width="340" height="55" rx="4" fill="#0d1117" stroke="#ff2bd6"/>
  <text x="435" y="274" fill="#ff2bd6" font-size="8" font-weight="600">Clickjacking Защита:</text>
  <text x="435" y="288" fill="#e6edf3" font-size="7">X-Frame-Options: DENY / CSP frame-ancestors 'none'</text>
  <text x="435" y="300" fill="#8b949e" font-size="6">Запрещает встраивать сайт в скрытый прозрачный iFrame</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Золотые стандарты безопасности фронтенд-приложений</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Всегда санитизируйте входящий HTML через DOMPurify перед вставкой в DOM</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Храните JWT refresh-токены исключительно в HttpOnly + Secure + SameSite=Strict cookies</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Настройте строгий заголовок CSP с запретом eval() и непроверенных внешних доменов</text>
</svg>