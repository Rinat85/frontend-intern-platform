<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgps10" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgps10)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Безопасность Фронтенда (Web Security)</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">XSS (Stored/Reflected/DOM), CSRF, Content Security Policy (CSP), CORS и HttpOnly Cookies</text>

  <!-- Left: XSS vs CSRF -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <text x="205" y="85" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">2 Главные Уязвимости: XSS и CSRF</text>

  <rect x="35" y="98" width="340" height="100" rx="4" fill="#0d1117" stroke="#f85149"/>
  <text x="45" y="114" fill="#f85149" font-size="9" font-weight="600">XSS (Cross-Site Scripting — Инъекция JS)</text>
  <text x="45" y="130" fill="#e6edf3" font-size="7">Злоумышленник внедряет чужой &lt;script&gt; на ваш сайт.</text>
  <text x="45" y="144" fill="#ffb02e" font-size="7">Цель: кража кук, токенов, кейлоггер, подмена формы.</text>
  <text x="45" y="160" fill="#2dff8a" font-size="7">🛡️ Защита: DOMPurify.sanitize(), textContent,</text>
  <text x="45" y="174" fill="#2dff8a" font-size="7">заголовок CSP и экранирование HTML.</text>

  <rect x="35" y="206" width="340" height="108" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="45" y="222" fill="#ffb02e" font-size="9" font-weight="600">CSRF (Cross-Site Request Forgery)</text>
  <text x="45" y="238" fill="#e6edf3" font-size="7">Чужой сайт отправляет запрос от имени жертвы.</text>
  <text x="45" y="252" fill="#8b949e" font-size="7">Браузер автоматически прикрепляет авторизационные куки!</text>
  <text x="45" y="270" fill="#2dff8a" font-size="7">🛡️ Защита: SameSite=Strict / Lax на куках,</text>
  <text x="45" y="286" fill="#2dff8a" font-size="7">CSRF-токены (X-CSRF-Token заголовок).</text>

  <!-- Right: CSP, CORS & Auth -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Защитные Механизмы Браузера</text>

  <rect x="425" y="98" width="340" height="68" rx="4" fill="#0d1117" stroke="#29e7ff"/>
  <text x="435" y="114" fill="#29e7ff" font-size="8" font-weight="600">CSP (Content Security Policy)</text>
  <text x="435" y="130" fill="#e6edf3" font-size="7">Content-Security-Policy: default-src 'self';</text>
  <text x="435" y="144" fill="#2dff8a" font-size="7">script-src 'self' https://trusted.cdn.com;</text>
  <text x="435" y="158" fill="#8b949e" font-size="6">Блокирует загрузку скриптов с чужих недоверенных доменов</text>

  <rect x="425" y="172" width="340" height="68" rx="4" fill="#0d1117" stroke="#ffb02e"/>
  <text x="435" y="188" fill="#ffb02e" font-size="8" font-weight="600">CORS (Cross-Origin Resource Sharing)</text>
  <text x="435" y="204" fill="#e6edf3" font-size="7">Access-Control-Allow-Origin: https://app.dev</text>
  <text x="435" y="218" fill="#e6edf3" font-size="7">Access-Control-Allow-Credentials: true</text>
  <text x="435" y="232" fill="#8b949e" font-size="6">Защищает серверы от запросов с неавторизованных доменов</text>

  <rect x="425" y="246" width="340" height="68" rx="4" fill="#0d1117" stroke="#2dff8a"/>
  <text x="435" y="262" fill="#2dff8a" font-size="8" font-weight="600">Хранение JWT токенов</text>
  <text x="435" y="276" fill="#f85149" font-size="7">❌ localStorage — уязвим для XSS скриптов!</text>
  <text x="435" y="292" fill="#2dff8a" font-size="7">✅ HttpOnly + Secure Cookie — JS не имеет доступа!</text>

  <!-- Bottom: Summary -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Золотое правило безопасности фронтенда</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Никогда не используйте innerHTML с данными от пользователя — используйте textContent или DOMPurify</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Храните Refresh Token в HttpOnly + Secure + SameSite=Strict cookie, а Access Token — в оперативной памяти JS</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Добавляйте строгие заголовки CSP и HSTS на production-серверах</text>
</svg>