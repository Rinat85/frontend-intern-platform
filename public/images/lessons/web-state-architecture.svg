<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgp7" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgp7)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: Архитектура State Management и FSD</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">UI = f(State), Unidirectional Data Flow, Observer/PubSub и Feature-Sliced Design</text>

  <!-- Left: Redux Flow (Unidirectional) -->
  <rect x="20" y="65" width="460" height="260" rx="8" fill="none" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="250" y="85" fill="#29e7ff" font-size="12" font-weight="600" text-anchor="middle">Однонаправленный поток данных (Redux / Flux)</text>
  
  <rect x="35" y="100" width="125" height="48" rx="6" fill="#0d1117" stroke="#ffb02e"/>
  <text x="97" y="120" fill="#ffb02e" font-size="10" font-weight="600" text-anchor="middle">1. Action</text>
  <text x="97" y="134" fill="#8b949e" font-size="7" text-anchor="middle">{ type, payload }</text>

  <line x1="160" y1="124" x2="190" y2="124" stroke="#29e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="116" fill="#29e7ff" font-size="7" text-anchor="middle">dispatch</text>

  <rect x="195" y="100" width="130" height="48" rx="6" fill="#0d1117" stroke="#2dff8a"/>
  <text x="260" y="120" fill="#2dff8a" font-size="10" font-weight="600" text-anchor="middle">2. Reducer</text>
  <text x="260" y="134" fill="#8b949e" font-size="7" text-anchor="middle">(state, act) =&gt; newState</text>

  <line x1="325" y1="124" x2="355" y2="124" stroke="#29e7ff" stroke-width="2"/>

  <rect x="360" y="100" width="120" height="48" rx="6" fill="#0d1117" stroke="#29e7ff"/>
  <text x="420" y="120" fill="#29e7ff" font-size="10" font-weight="600" text-anchor="middle">3. Store</text>
  <text x="420" y="134" fill="#8b949e" font-size="7" text-anchor="middle">Single Source of Truth</text>

  <!-- UI Box -->
  <rect x="150" y="180" width="220" height="50" rx="6" fill="#161b22" stroke="#d2a8ff"/>
  <text x="260" y="202" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">UI = f(State)</text>
  <text x="260" y="218" fill="#8b949e" font-size="8" text-anchor="middle">Рендеринг компонентов по селекторам</text>

  <line x1="420" y1="148" x2="420" y2="205" stroke="#29e7ff" stroke-dasharray="3,3"/>
  <line x1="420" y1="205" x2="370" y2="205" stroke="#29e7ff" stroke-dasharray="3,3"/>
  <text x="435" y="180" fill="#29e7ff" font-size="7">subscribe</text>

  <line x1="150" y1="205" x2="97" y2="205" stroke="#ffb02e" stroke-dasharray="3,3"/>
  <line x1="97" y1="205" x2="97" y2="148" stroke="#ffb02e" stroke-dasharray="3,3"/>
  <text x="65" y="180" fill="#ffb02e" font-size="7">user event</text>

  <rect x="35" y="250" width="430" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="250" y="268" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">3 Принципа Redux Архитектуры:</text>
  <text x="250" y="284" fill="#e6edf3" font-size="8" text-anchor="middle">1. Единый источник правды (Store) | 2. Состояние только для чтения (Read-Only)</text>
  <text x="250" y="298" fill="#e6edf3" font-size="8" text-anchor="middle">3. Изменения происходят строго через Чистые Функции (Reducers)</text>

  <!-- Right: FSD Layer Architecture -->
  <rect x="500" y="65" width="280" height="260" rx="8" fill="none" stroke="#ffb02e" stroke-width="1.5"/>
  <text x="640" y="85" fill="#ffb02e" font-size="12" font-weight="600" text-anchor="middle">Слои Feature-Sliced Design (FSD)</text>
  
  <rect x="515" y="98" width="250" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="640" y="114" fill="#8b949e" font-size="8" text-anchor="middle">app (провайдеры, стили, роутер)</text>
  <rect x="515" y="126" width="250" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="640" y="142" fill="#8b949e" font-size="8" text-anchor="middle">pages (композиция страниц)</text>
  <rect x="515" y="154" width="250" height="24" rx="4" fill="#0d1117" stroke="#29e7ff"/><text x="640" y="170" fill="#29e7ff" font-size="8" text-anchor="middle">widgets (самодостаточные блоки UI)</text>
  <rect x="515" y="182" width="250" height="24" rx="4" fill="#0d1117" stroke="#2dff8a"/><text x="640" y="198" fill="#2dff8a" font-size="8" text-anchor="middle">features (пользовательские фичи/кейсы)</text>
  <rect x="515" y="210" width="250" height="24" rx="4" fill="#0d1117" stroke="#ffb02e"/><text x="640" y="226" fill="#ffb02e" font-size="8" text-anchor="middle">entities (бизнес-сущности: user, cart)</text>
  <rect x="515" y="238" width="250" height="24" rx="4" fill="#0d1117" stroke="#30363d"/><text x="640" y="254" fill="#8b949e" font-size="8" text-anchor="middle">shared (UI-kit, api клиент, хелперы)</text>

  <text x="640" y="285" fill="#f85149" font-size="8" font-weight="600" text-anchor="middle">Правило направленности FSD:</text>
  <text x="640" y="300" fill="#8b949e" font-size="7" text-anchor="middle">Импорты идут строго СВЕРХУ ВНИЗ</text>
  <text x="640" y="312" fill="#8b949e" font-size="7" text-anchor="middle">entities не могут импортировать features!</text>

  <!-- Bottom: State vs URL Rule -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Совет Senior: Что хранить в State, а что в URL?</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• URL Query (?page=2&amp;search=vue): фильтры, сортировки, пагинация (чтобы можно было поделиться ссылкой!)</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Global Store: авторизованный юзер, корзина, уведомления, кэш сервера</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Local State (useState): открыт ли dropdown, ховер карточки, значение промежуточного инпута</text>
</svg>