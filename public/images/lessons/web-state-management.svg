<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'JetBrains Mono',monospace">
  <defs><linearGradient id="bgwsm13" x1="0" y1="0" x2="800" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a0e13"/><stop offset="100%" stop-color="#0d1219"/></linearGradient></defs>
  <rect width="800" height="440" fill="url(#bgwsm13)" rx="12"/>
  <text x="400" y="30" fill="#2dff8a" font-size="16" font-weight="700" text-anchor="middle">Web Pro: State Management — Управление состоянием</text>
  <text x="400" y="48" fill="#8b949e" font-size="10" text-anchor="middle">Local State, Global State, Server State, URL State, Redux Toolkit, Zustand, TanStack Query</text>

  <!-- Left: Types of State -->
  <rect x="20" y="65" width="370" height="260" rx="8" fill="#0d1117" stroke="#29e7ff" stroke-width="1.5"/>
  <text x="205" y="85" fill="#29e7ff" font-size="11" font-weight="600" text-anchor="middle">4 типа состояния в SPA</text>

  <rect x="35" y="100" width="340" height="48" rx="4" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="45" y="118" fill="#2dff8a" font-size="8" font-weight="600">1. Local State (Локальное)</text>
  <text x="45" y="134" fill="#8b949e" font-size="7">useState, useRef — открыт ли модал? значение инпута</text>

  <rect x="35" y="154" width="340" height="48" rx="4" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="45" y="172" fill="#29e7ff" font-size="8" font-weight="600">2. Global State (Глобальное)</text>
  <text x="45" y="188" fill="#8b949e" font-size="7">Redux, Zustand — авторизация, тема, корзина, права</text>

  <rect x="35" y="208" width="340" height="48" rx="4" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="45" y="226" fill="#ffb02e" font-size="8" font-weight="600">3. Server State (Серверное)</text>
  <text x="45" y="242" fill="#8b949e" font-size="7">TanStack Query, SWR — кеш API, stale-while-revalidate</text>

  <rect x="35" y="262" width="340" height="48" rx="4" fill="#d2a8ff22" stroke="#d2a8ff"/>
  <text x="45" y="280" fill="#d2a8ff" font-size="8" font-weight="600">4. URL State (Маршрутное)</text>
  <text x="45" y="296" fill="#8b949e" font-size="7">?page=2&amp;sort=price — фильтры, пагинация, поиск</text>

  <!-- Right: Redux Flow -->
  <rect x="410" y="65" width="370" height="260" rx="8" fill="none" stroke="#2dff8a" stroke-width="1.5"/>
  <text x="595" y="85" fill="#2dff8a" font-size="12" font-weight="600" text-anchor="middle">Однонаправленный поток данных</text>

  <rect x="480" y="100" width="150" height="34" rx="17" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="555" y="122" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">UI (View)</text>

  <text x="555" y="148" fill="#8b949e" font-size="10" text-anchor="middle">↓ dispatch(action)</text>

  <rect x="480" y="158" width="150" height="34" rx="17" fill="#29e7ff22" stroke="#29e7ff"/>
  <text x="555" y="180" fill="#29e7ff" font-size="9" font-weight="600" text-anchor="middle">Action / Event</text>

  <text x="555" y="206" fill="#8b949e" font-size="10" text-anchor="middle">↓ reducer(state, action)</text>

  <rect x="480" y="216" width="150" height="34" rx="17" fill="#ffb02e22" stroke="#ffb02e"/>
  <text x="555" y="238" fill="#ffb02e" font-size="9" font-weight="600" text-anchor="middle">Store (State)</text>

  <text x="555" y="264" fill="#8b949e" font-size="10" text-anchor="middle">↓ useSelector()</text>

  <rect x="480" y="274" width="150" height="34" rx="17" fill="#2dff8a22" stroke="#2dff8a"/>
  <text x="555" y="296" fill="#2dff8a" font-size="9" font-weight="600" text-anchor="middle">UI (Re-render)</text>

  <text x="435" y="204" fill="#d2a8ff" font-size="20">↻</text>

  <!-- Bottom -->
  <rect x="20" y="335" width="760" height="90" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="355" fill="#2dff8a" font-size="11" font-weight="600" text-anchor="middle">💡 Как выбрать стейт-менеджер</text>
  <text x="400" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">• Простой проект (1–3 формы): достаточно useState + useContext. Не тянем Redux!</text>
  <text x="400" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">• Средний (5–20 экранов): Zustand (3 Кб, без бойлерплейта) или Jotai (атомарный подход)</text>
  <text x="400" y="405" fill="#8b949e" font-size="8" text-anchor="middle">• Крупный enterprise: Redux Toolkit + TanStack Query (серверный кеш отдельно от UI стейта)</text>
</svg>